<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Tucano Música — Videoclipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../tucano.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.glass{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6);transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);transform:scale(1.02)}
input,select{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;color:#fff;width:100%;outline:none;font-size:15px;font-family:inherit}
input:focus,select:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.2)}
::placeholder{color:#64748b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-size:15px;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8}
.btn-outline:hover{border-color:#0ea5e9;color:#0ea5e9}
.checkbox-custom{width:16px;height:16px;accent-color:#0ea5e9}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none !important}
</style>
</head>
<body>

<main class="min-h-screen p-4">
  <div class="max-w-3xl mx-auto">
    <div class="glass p-6 mb-4">
      <h2 class="text-2xl font-bold mb-4 text-sky-400"><i class="fas fa-video mr-2"></i>Distribuição de Videoclipe</h2>
      <label for="v-trk" class="block mb-2">Música *</label>
      <select id="v-trk"><option value="">Selecione uma faixa...</option></select>
    </div>
    <div id="v-area" class="glass p-6 hidden space-y-4">
      <div>
        <label for="v-file" class="block mb-2">Vídeo (.mp4 ou .mov) *</label>
        <input id="v-file" type="file" accept=".mp4,.mov">
      </div>
      <div>
        <label for="v-cov" class="block mb-2">Capa (.png, .jpg, .jpeg) *</label>
        <input id="v-cov" type="file" accept=".png,.jpg,.jpeg">
      </div>
      <fieldset>
        <legend class="mb-2">Plataformas *</legend>
        <label class="flex items-center gap-2 mb-1"><input type="checkbox" class="v-plat checkbox-custom" value="YouTube"> YouTube</label>
        <label class="flex items-center gap-2 mb-1"><input type="checkbox" class="v-plat checkbox-custom" value="Vevo"> Vevo</label>
        <label class="flex items-center gap-2 mb-1"><input type="checkbox" class="v-plat checkbox-custom" value="Apple Music"> Apple Music</label>
        <label class="flex items-center gap-2"><input type="checkbox" class="v-plat checkbox-custom" value="Tidal"> Tidal</label>
      </fieldset>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="v-date" class="block mb-2 text-sm">Data *</label>
          <input id="v-date" type="date">
        </div>
        <div>
          <label for="v-time" class="block mb-2 text-sm">Horário *</label>
          <input id="v-time" type="time">
        </div>
      </div>
      <p id="v-error" class="text-red-400 text-sm hidden"></p>
      <button id="v-end" class="btn btn-primary w-full" type="button"><i class="fas fa-paper-plane"></i> Enviar Videoclipe</button>
    </div>
    <a href="../dashboard/dashboard.html" class="btn btn-outline w-full mt-3"><i class="fas fa-arrow-left"></i> Voltar</a>
  </div>
</main>

<script>
(function(){
'use strict';
var SUPABASE_URL='https://mjqwiqjojkzobuysziyv.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcXdpcWpvamt6b2J1eXN6aXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3Nzc4MzMsImV4cCI6MjEwNjM1MzgzM30.w4zDJdmA[...';
var BUCKET='releases';
var SESSION_KEY='tucano_session_v2';
var ACCOUNTS_KEY='tucano_accounts_v2';

var _sb=null;
function getSupabase(){
  if(_sb) return _sb;
  if(!window.supabase||!window.supabase.createClient){
    throw new Error('Biblioteca do Supabase não carregou (verifique a internet).');
  }
  _sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  return _sb;
}
async function uploadFile(file,path){
  var sb=getSupabase();
  var r=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false});
  if(r.error) throw new Error('Supabase: '+(r.error.message||JSON.stringify(r.error)));
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function uploadText(text,path){
  var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  var file=new File([blob],path.split('/').pop(),{type:'text/plain'});
  return await uploadFile(file,path);
}
function getUser(){
  try{
    var s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s) return null;
    var acc=JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'{}');
    return acc[(s.username||'').toLowerCase()]||null;
  }catch(e){ return null; }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(d){ if(!d) return ''; var p=d.split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):d; }
function datePlus(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

document.addEventListener('DOMContentLoaded',function(){
  var u=getUser();
  if(!u){ window.location.href='../index.html'; return; }
  if(!u.releases||!u.releases.length){
    alert('Você precisa ter pelo menos um lançamento enviado.');
    window.location.href='../dashboard/dashboard.html';
    return;
  }

  var sel=document.getElementById('v-trk');
  var area=document.getElementById('v-area');
  var map={};

  u.releases.forEach(function(rel){
    (rel.tracks||[]).forEach(function(t,i){
      var key=rel.id+'::'+i;
      map[key]={ releaseTitle: rel.title, title: t.title, artist: t.artist||'' };
      var opt=document.createElement('option');
      opt.value=key;
      opt.textContent=rel.title+' — '+t.title;
      sel.appendChild(opt);
    });
  });

  document.getElementById('v-date').min=datePlus(28);

  sel.addEventListener('change',function(){
    if(sel.value) area.classList.remove('hidden');
    else area.classList.add('hidden');
  });

  document.getElementById('v-end').addEventListener('click',async function(){
    var btn=this;
    var errBox=document.getElementById('v-error');
    errBox.classList.add('hidden');

    var key=sel.value;
    var video=document.getElementById('v-file').files[0];
    var cover=document.getElementById('v-cov').files[0];
    var plats=Array.from(document.querySelectorAll('.v-plat:checked')).map(function(c){ return c.value; });
    var date=document.getElementById('v-date').value;
    var time=document.getElementById('v-time').value;

    if(!key||!video||!cover||!plats.length||!date||!time){
      errBox.textContent='Preencha todos os campos obrigatórios.';
      errBox.classList.remove('hidden');
      return;
    }
    var ext=video.name.toLowerCase().split('.').pop();
    if(ext!=='mp4'&&ext!=='mov'){
      errBox.textContent='Vídeo deve ser .mp4 ou .mov.';
      errBox.classList.remove('hidden');
      return;
    }

    var oldHtml=btn.innerHTML;
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span> Enviando...';

    try{
      var videoId=uid();
      var basePath=u.username+'/video_'+videoId;

      var videoUrl=await uploadFile(video, basePath+'/video_'+video.name);
      var coverUrl=await uploadFile(cover, basePath+'/capa_'+cover.name);

      var track=map[key];
      var txt='Videoclipe novo\n\n'
        +'Música: '+track.title+'\n'
        +'Release original: '+track.releaseTitle+'\n'
        +'Artista principal: '+(track.artist||'')+'\n'
        +'Plataformas: '+plats.join(', ')+'\n'
        +'Data de lançamento: '+fmtDate(date)+'\n'
        +'Horário: '+time+'\n\n'
        +'DADOS DO ARTISTA\n'
        +'Nome completo: '+(u.fullName||'')+'\n'
        +'Nome artístico: '+(u.artistName||'')+'\n'
        +'E-mail: '+(u.email||'')+'\n'
        +'WhatsApp: '+(u.whatsapp||'')+'\n'
        +'Usuário: '+u.username+'\n'
        +'Data do envio: '+new Date().toLocaleString('pt-BR')+'\n'
        +'Vídeo: '+videoUrl+'\n'
        +'Capa: '+coverUrl;

      await uploadText(txt, basePath+'/metadados.txt');

      if(!u.videoReleases) u.videoReleases=[];
      u.videoReleases.push({
        id: videoId,
        track: track.title,
        releaseTitle: track.releaseTitle,
        videoUrl: videoUrl,
        coverUrl: coverUrl,
        platforms: plats,
        status: 'Em revisão',
        createdAt: Date.now()
      });
      var acc=JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'{}');
      acc[u.username.toLowerCase()]=u;
      localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(acc));

      alert('Videoclipe enviado!');
      window.location.href='../dashboard/dashboard.html';
    }catch(e){
      btn.disabled=false;
      btn.innerHTML=oldHtml;
      errBox.textContent=e.message||'Erro ao enviar.';
      errBox.classList.remove('hidden');
    }
  });
});
})();
</script>
</body>
</html>
