<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Tucano Música — Contrato</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./tucano.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.glass{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6);transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);transform:scale(1.02)}
.contract-fill{background:rgba(251,191,36,.15);color:#fbbf24;padding:2px 8px;border-radius:6px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-size:15px;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.checkbox-custom{width:18px;height:18px;accent-color:#0ea5e9}
</style>
</head>
<body>

<main class="min-h-screen flex items-center justify-center p-4">
  <div class="glass w-full max-w-3xl p-6 md:p-8">
    <h2 class="text-2xl font-bold mb-4 text-sky-400 text-center">Contrato de Distribuição</h2>
    <div id="contract-text" class="bg-slate-900/60 p-6 rounded-xl max-h-96 overflow-y-auto mb-6 text-sm whitespace-pre-wrap"></div>
    <label class="flex items-center gap-3 mb-4 cursor-pointer">
      <input id="agree" type="checkbox" class="checkbox-custom">
      <span>Concordo integralmente com todas as cláusulas.</span>
    </label>
    <button id="sign" class="btn btn-primary w-full" type="button" disabled>
      <i class="fas fa-signature"></i> Assinar Contrato
    </button>
  </div>
</main>

<script>
(function(){
'use strict';
var ACCOUNTS_KEY='tucano_accounts_v2';
var SESSION_KEY='tucano_session_v2';
var FORM_KEY='tucano_contract_form';

function normUser(u){ return (u||'').toString().trim().toLowerCase(); }
function loadAccounts(){ try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'{}'); }catch(e){ return {}; } }
function saveAccounts(a){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }
function getUser(){
  try{
    var s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s) return null;
    var acc=loadAccounts();
    return acc[normUser(s.username)]||null;
  }catch(e){ return null; }
}
function persist(u){
  var acc=loadAccounts();
  acc[normUser(u.username)]=u;
  saveAccounts(acc);
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function buildContract(full,art,mail,whats,today){
  var F='<span class="contract-fill">'+esc(full)+'</span>';
  var A='<span class="contract-fill">'+esc(art)+'</span>';
  var M='<span class="contract-fill">'+esc(mail)+'</span>';
  var W='<span class="contract-fill">'+esc(whats)+'</span>';
  var D='<span class="contract-fill">'+esc(today)+'</span>';

  return 'CONTRATO DE DISTRIBUIÇÃO FONOGRÁFICA E AUDIOVISUAL\n\n'
  +'Nota importante: Isto não é um contrato de verdade, mas sim um acordo entre amigos. A Tucano Música não foi criada com intuito empresarial, mas como uma ajuda entre amigos.\n\n'
  +'Pelo presente instrumento particular, Tucano Música, com seu representante legal Yan Matheus Antunes Batista, doravante denominado Tucano, e '+F+', de nome artístico '+A+', e-mail '+M+' e WhatsApp '+W+', doravante denominado Artista, tem entre si justo e contratado o seguinte:\n\n'
  +'1. Proposta\n\nA Tucano deverá distribuir as obras fonográficas (doravante "Obras") ou audiovisuais (doravante "Vídeos") do Artista nas principais plataformas digitais.\n\n'
  +'2. Requisitos\n\nPara áudio:\n\nMP3;\nWAV;\n320kbps se for MP3;\n16/24 bits;\ncodec PCM_S16LE/PCM_S24LE;\n44,1kHz+;\nCapa em PNG ou JPG/JPEG, quadrado, únicos textos permitidos são nome do lançamento, do artista/banda e opcionalmente, obrigatoriamente se for explícito, selo Parental Advisory.\n\nPara vídeo:\n\nMP4;\nMOV;\n720p mínimo;\n1920x1080;\n24fps;\nCapa em PNG ou JPG/JPEG, 1920x1080, permitido apenas selo Parental Advisory(opcionalmente, obrigatoriamente se for explícito) como texto.\n\n'
  +'3. Exclusividade\n\nEste contrato não é exclusivo, podendo o Artista distribuir suas obras em outras distribuidoras.\n\n'
  +'4. Direitos autorais\n\nO Artista mantém 100% dos direitos autorais, fonográficos e conexos sobre suas Obras e Vídeos. A Tucano não reivindica nenhum direito sobre as obras além da distribuição digital prevista neste acordo.\n\n'
  +'5. Royalties\n\n5.1. A comissão sobre royalties de Obras e Vídeos é de 25% para a Tucano e 75% para o Artista.\n5.2. A Tucano deverá pagar os royalties em até 15 dias corridos após receber das plataformas.\n5.3. Como acordo entre amigos, não há taxa de adesão nem cobrança extra além da comissão prevista no item 5.1.\n\n'
  +'6. Vigência, vigor e renovação\n\n6.1. A vigência deste contrato é de 30(trinta) dias corridos.\n6.2. O vigor deste contrato tem efeito imediato.\n6.3. A renovação é automática, salvo se qualquer das partes manifestar intenção de rescindir conforme a cláusula 7.\n\n'
  +'7. Rescisão\n\n7.1. A rescisão é gratuita, podendo ser realizada por acordo entre a Tucano e o Artista.\n7.2. Após a rescisão, a Tucano tem até 15 dias corridos para remover as Obras e Vídeos do Artista das plataformas digitais.\n\n'
  +'8. Quem pode usar\n\nApenas estudantes do colégio do representante legal da Tucano são membros autorizados para a distribuição.\n\n'
  +'9. Conduta\n\nNão serão aceitas Obras ou Vídeos que contenham:\n\nPlágio de outro artista sem licença;\nApologia a crime, drogas ou violência;\nDiscurso de ódio;\nConteúdo sexual sem aviso explícito.\n\n'
  +'10. Foro\n\nFica eleito o foro da carteira do Yan para dirimir quaisquer controvérsias oriundas deste contrato.\n\n'
  +'E por estarem assim, justos e contratados, as partes assinam este contrato em 2 vias de igual teor, uma no site/aplicativo oficial e outra em PDF.\n\n'
  +'Data de celebração: '+D+'\n\n'
  +'Pela Tucano: Tucano.\nPelo Artista:\n';
}

document.addEventListener('DOMContentLoaded',function(){
  var u=getUser();
  if(!u){ window.location.href='./index.html'; return; }
  if(u.contractType!=='none'||u.contractSigned){ window.location.href='./dashboard.html'; return; }

  var f;
  try{ f=JSON.parse(localStorage.getItem(FORM_KEY)||'null'); }catch(e){ f=null; }
  if(!f){ window.location.href='./contrato-form.html'; return; }

  var today=new Date().toLocaleDateString('pt-BR');
  document.getElementById('contract-text').innerHTML=buildContract(f.full,f.art,f.mail,f.whats,today);

  var agree=document.getElementById('agree');
  var sign=document.getElementById('sign');
  agree.addEventListener('change',function(){ sign.disabled=!agree.checked; });

  sign.addEventListener('click',function(){
    u.fullName=f.full;
    u.artistName=f.art;
    u.email=f.mail;
    u.whatsapp=f.whats;
    u.contractType='tucano';
    u.contractSigned=true;
    u.contractPdfDownloaded=false;
    u.hasRealContract=true;
    if(!u.artists) u.artists=[];
    if(u.artists.indexOf(f.art)===-1) u.artists.push(f.art);
    persist(u);
    localStorage.removeItem(FORM_KEY);
    window.location.href='./contrato-assinado.html';
  });
});
})();
</script>
</body>
</html>
