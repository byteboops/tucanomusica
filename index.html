  <style>
    :root {
      --bg-primary:#0f172a; --bg-secondary:#1e293b; --bg-tertiary:#334155;
      --text-primary:#f8fafc; --text-secondary:#cbd5e1; --text-muted:#94a3b8;
      --border-color:rgba(148,163,184,.15);
      --accent-blue:#0ea5e9; --accent-blue-dark:#3b82f6; --accent-yellow:#fbbf24;
      --accent-green:#22c55e; --accent-red:#ef4444; --accent-purple:#a855f7;
      --glass-bg:rgba(30,41,59,.6); --glass-border:rgba(148,163,184,.15);
    }
    html[data-theme="light"] {
      --bg-primary:#f1f5f9; --bg-secondary:#e2e8f0; --bg-tertiary:#cbd5e1;
      --text-primary:#0f172a; --text-secondary:#334155; --text-muted:#64748b;
      --border-color:rgba(100,116,139,.2);
      --glass-bg:rgba(255,255,255,.85); --glass-border:rgba(148,163,184,.3);
    }
    *{font-family:'Josefin Sans',sans-serif;}
    body{background:var(--bg-primary);color:var(--text-primary);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden;}
    .glass{background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:20px;}
    .glow{box-shadow:0 0 40px rgba(14,165,233,.15),0 0 80px rgba(14,165,233,.05);}
    .btn-primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6);color:#fff!important;border-radius:12px;padding:.75rem 1.5rem;font-weight:600;transition:all .25s ease;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(14,165,233,.4);}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
    .btn-secondary{background:var(--bg-tertiary);color:var(--text-primary);border-radius:12px;padding:.75rem 1.5rem;font-weight:500;transition:all .25s ease;border:1px solid var(--border-color);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;}
    .btn-secondary:hover{background:var(--bg-secondary);border-color:var(--accent-blue);}
    .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff!important;border-radius:12px;padding:.75rem 1.5rem;font-weight:600;transition:all .25s ease;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;}
    .btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(239,68,68,.4);}
    .progress-bar{width:100%;height:8px;background:var(--bg-tertiary);border-radius:999px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#3b82f6);border-radius:999px;transition:width .3s ease;width:0%;}
    .grid-card{transition:transform .25s ease,box-shadow .25s ease;}
    .grid-card:hover{transform:scale(1.02);box-shadow:0 10px 40px rgba(0,0,0,.3);}
    .tucano-logo{max-width:280px;height:auto;}
    .contract-fill{background:rgba(251,191,36,.15);color:#fbbf24;padding:1px 6px;border-radius:4px;font-weight:500;}
    input,select,textarea{background:var(--bg-secondary)!important;border:1px solid var(--bg-tertiary)!important;border-radius:12px!important;padding:.75rem!important;color:var(--text-primary)!important;width:100%;transition:border-color .2s,box-shadow .2s;font-family:'Josefin Sans',sans-serif;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-blue)!important;box-shadow:0 0 0 3px rgba(14,165,233,.15);}
    input::placeholder,textarea::placeholder{color:var(--text-muted);}
    label{color:var(--text-secondary);font-size:.875rem;font-weight:500;display:block;margin-bottom:.375rem;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .fade-in{animation:fadeIn .5s ease forwards;}
    @keyframes fadeInScale{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
    .fade-in-scale{animation:fadeInScale .4s ease forwards;}
    @keyframes pulseGlow{0%,100%{box-shadow:0 0 20px rgba(14,165,233,.2);}50%{box-shadow:0 0 40px rgba(14,165,233,.4);}}
    .pulse-glow{animation:pulseGlow 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
    .float{animation:float 4s ease-in-out infinite;}
    .hamburger-menu{position:fixed;top:70px;right:16px;width:260px;background:var(--glass-bg);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:16px;padding:8px;z-index:100;display:none;box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .hamburger-menu.open{display:block;animation:fadeInScale .2s ease;}
    .menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;cursor:pointer;transition:background .2s;color:var(--text-primary);font-weight:500;font-size:.9rem;border:none;background:transparent;width:100%;text-align:left;}
    .menu-item:hover{background:rgba(14,165,233,.1);}
    .menu-item.danger{color:#ef4444;}
    .menu-item.danger:hover{background:rgba(239,68,68,.1);}
    .menu-item:disabled{opacity:.4;cursor:not-allowed;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease;}
    .modal-content{background:var(--bg-secondary);border:1px solid var(--glass-border);border-radius:20px;padding:32px;max-width:480px;width:100%;animation:fadeInScale .25s ease;max-height:85vh;overflow-y:auto;}
    .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:600;}
    .release-card-cover{aspect-ratio:1;width:100%;border-radius:12px;object-fit:cover;background:var(--bg-tertiary);}
    .type-card{cursor:pointer;transition:all .25s ease;border:2px solid transparent;}
    .type-card:hover{border-color:var(--accent-blue);transform:translateY(-4px);}
    .kebab-menu{position:absolute;bottom:12px;right:12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:10px;padding:4px;z-index:10;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4);min-width:150px;}
    .kebab-menu.open{display:block;animation:fadeInScale .15s ease;}
    .kebab-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.85rem;color:var(--text-primary);border:none;background:transparent;width:100%;text-align:left;}
    .kebab-item:hover{background:var(--bg-secondary);}
    .kebab-item.danger{color:#ef4444;}
    .scrollbar-thin::-webkit-scrollbar{width:6px;}
    .scrollbar-thin::-webkit-scrollbar-track{background:transparent;}
    .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:999px;}
    .file-input-wrapper{position:relative;overflow:hidden;display:inline-block;width:100%;}
    .file-input-wrapper input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .landing-bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(3px) brightness(.4);z-index:-1;}
    .checkbox-custom{width:20px;height:20px;border-radius:6px;border:2px solid var(--bg-tertiary);background:var(--bg-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
    .checkbox-custom.checked{background:var(--accent-blue);border-color:var(--accent-blue);}
    .checkbox-custom.checked::after{content:'✓';color:#fff;font-size:14px;font-weight:bold;}
    .checkbox-custom:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;}
    .alert-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:16px;color:#fca5a5;}
    .warning-box{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:16px;color:#fde68a;}
    .success-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:16px;color:#86efac;}
    .info-box{background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.3);border-radius:12px;padding:16px;color:#7dd3fc;}
    @media (max-width:640px){.tucano-logo{max-width:200px;}.hamburger-menu{width:calc(100vw - 32px);right:16px;}}
  </style>
</head>

    // ============================================================

    function defaultAccounts(){

    // ============================================================
    // UTILITÁRIOS
    // ============================================================
    function normUser(u){ return String(u||'').trim().toLowerCase(); }
    function $(sel,ctx){ return (ctx||document).querySelector(sel); }
    function $$(sel,ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
    function esc(s){
      return String(s==null?'':s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function fmtDate(d){
      if(!d) return '';
      try{
        const dt = (typeof d==='string' && d.length===10) ? new Date(d+'T12:00:00') : new Date(d);
        return dt.toLocaleDateString('pt-BR');
      }catch(e){ return String(d); }
    }
    function uid(){
      if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    }
    function datePlus(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
    function safePathUser(u){
      return String(u||'anon').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,40)||'anon';
    }
    function safeName(n){
      return String(n||'file').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_').slice(0,80);
    }
    function normStatus(s){
      return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    }
    function displayStatus(s){
      const n = normStatus(s);
      if(n==='ao vivo') return 'Ao Vivo';
      if(n==='aprovado') return 'Aprovado';
      if(n==='revisao') return 'Revisão';
      if(n==='rejeitado') return 'Rejeitado';
      return s || 'Rascunho';
    }
    function getStatusColor(status){ return STATUS_COLORS[displayStatus(status)] || STATUS_COLORS['Rascunho']; }
    function isBlocked(){
      const u = state.user; if(!u) return true;
      return !!(u.disabled || u.rescinded || u.deleted);
    }
    function canCreate(){
      const u = state.user; if(!u) return false;
      return !(u.disabled || u.rescinded || u.deleted);
    }

    // ============================================================
    // DELTA DE ESTADO (localStorage) POR CONTA
    // Guarda APENAS os campos mutáveis. Nunca username/password.
    // ============================================================
    const DELTA_FIELDS = [
      'releases','artists','videoReleases',
      'answeredContract','contractType','contractSigned','contractPdfDownloaded',
      'knittingAcknowledged','hasRealContract',
      'disabled','rescinded','deleted',
      'bandMembers',
      'fullName','artistName','email','whatsapp','tiktok','schoolGrade'
    ];

    function loadDelta(username){
      try{
        const raw = localStorage.getItem(STATE_PREFIX + normUser(username));
        if(!raw) return {};
        const obj = JSON.parse(raw);
        return (obj && typeof obj==='object') ? obj : {};
      }catch(e){ return {}; }
    }
    function saveDelta(username, delta){
      const clean = {};
      for(const k of DELTA_FIELDS){ if(k in delta) clean[k] = delta[k]; }
      localStorage.setItem(STATE_PREFIX + normUser(username), JSON.stringify(clean));
    }
    function clearDelta(username){
      localStorage.removeItem(STATE_PREFIX + normUser(username));
    }

    // Retorna a conta "mesclada" (HTML + delta), ou null se não existir no HTML.
    function getAccount(username){
      const key = normUser(username);
      const base = defaultAccounts()[key];
      if(!base) return null;
      const delta = loadDelta(key);
      const merged = { ...base, ...delta };
      if(!Array.isArray(merged.releases)) merged.releases = [];
      if(!Array.isArray(merged.videoReleases)) merged.videoReleases = [];
      if(!Array.isArray(merged.artists)) merged.artists = [];
      if(!Array.isArray(merged.bandMembers)) merged.bandMembers = [];
      return merged;
    }

    // Persiste APENAS o delta da conta logada.
    function persistUser(){
      if(!state.user) return;
      const delta = {};
      for(const k of DELTA_FIELDS){ if(k in state.user) delta[k] = state.user[k]; }
      saveDelta(state.user.username, delta);
      const key = normUser(state.user.username);
      localStorage.setItem(SESSION_KEY, key);
      localStorage.setItem(SESSION_LEGACY_KEY, key);
    }

    // ============================================================
    // SUPABASE
    // ============================================================
    let _sb = null;
    function getSupabase(){
      if(!window.supabase) throw new Error('Biblioteca do Supabase não carregou (verifique a internet).');
      if(!_sb) _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return _sb;
    }
    async function uploadFile(file, path){
      const sb = getSupabase();
      const { error } = await sb.storage.from(BUCKET).upload(path, file, { cacheControl:'3600', upsert:true });
      if(error) throw new Error('Supabase: '+(error.message||JSON.stringify(error)));
      const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }
    async function uploadText(text, path){
      const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
      const file = new File([blob], safeName(path.split('/').pop()), { type:'text/plain' });
      return await uploadFile(file, path);
    }
    async function deleteFolderFiles(folderPath){
      const sb = getSupabase();
      const { data, error } = await sb.storage.from(BUCKET).list(folderPath);
      if(error){ console.warn('list error', error); return; }
      if(!data || !data.length) return;
      const paths = data.map(f => folderPath + '/' + f.name);
      const { error: delErr } = await sb.storage.from(BUCKET).remove(paths);
      if(delErr) console.warn('remove error', delErr);
    }
    async function fetchTextFile(path){
      try{
        const sb = getSupabase();
        const { data, error } = await sb.storage.from(BUCKET).download(path);
        if(error) return null;
        return await data.text();
      }catch(e){ return null; }
    }
    function parseStatusTxt(txt){
      if(!txt) return null;
      const s = txt.match(/^\s*Status\s*:\s*(.*)$/mi);
      const m = txt.match(/^\s*Motivo\s*:\s*(.*)$/mi);
      return { status: s ? (s[1].trim() || null) : null, motivo: m ? m[1].trim() : '' };
    }

    // ============================================================
    // SONS
    // ============================================================
    const soundCache = {};
    function playSound(name){
      try{
        const files = { botao:'./botao.mp3', alerta:'./alerta.wav', sucesso:'./sucesso.mp3', sucessao:'./sucessao.mp3' };
        const src = files[name]; if(!src) return;
        if(!soundCache[src]){ soundCache[src] = new Audio(src); soundCache[src].preload='auto'; }
        const a = soundCache[src].cloneNode(); a.volume = 0.6; a.play().catch(()=>{});
      }catch(e){}
    }

    // ============================================================
    // POLLING DE STATUS
    // ============================================================
    async function refreshReleaseStatuses(){
      if(!state.user || state.statusFetching) return;
      state.statusFetching = true;
      let changed = false;
      try{
        for(const r of (state.user.releases || [])){
          if(!r.basePath) continue;
          const txt = await fetchTextFile(`${r.basePath}/status.txt`);
          if(!txt) continue;
          const p = parseStatusTxt(txt); if(!p || !p.status) continue;
          const disp = displayStatus(p.status);
          if(disp !== r.status || p.motivo !== (r.motivo||'')){
            r.status = disp; r.motivo = p.motivo; changed = true;
          }
        }
        for(const v of (state.user.videoReleases || [])){
          if(!v.basePath) continue;
          const txt = await fetchTextFile(`${v.basePath}/status.txt`);
          if(!txt) continue;
          const p = parseStatusTxt(txt); if(!p || !p.status) continue;
          const disp = displayStatus(p.status);
          if(disp !== v.status || p.motivo !== (v.motivo||'')){
            v.status = disp; v.motivo = p.motivo; changed = true;
          }
        }
        if(changed){
          persistUser();
          if((state.page==='dashboard' || state.page==='catalogs') && !document.activeElement?.matches?.('input,select,textarea')){
            render();
          }
        }
      }catch(e){ console.warn('refreshReleaseStatuses', e); }
      finally{ state.statusFetching = false; }
    }
    function startStatusPolling(){
      if(state.statusPollTimer) return;
      if(!state.user) return;
      refreshReleaseStatuses();
      state.statusPollTimer = setInterval(()=>{ if(state.user) refreshReleaseStatuses(); }, STATUS_POLL_MS);
    }
    function stopStatusPolling(){
      if(state.statusPollTimer){ clearInterval(state.statusPollTimer); state.statusPollTimer = null; }
    }

    // ============================================================
    // RENDER PRINCIPAL
    // ============================================================
    function render(){
      const app = $('#app'); if(!app) return;
      let html=''; let binder=null;

      if(state.page==='apply'){ html=viewApply(); binder=bindApply; }
      else if(state.page==='login'){ html=viewLogin(); binder=bindLogin; }
      else if(!state.user){ html=viewLanding(); binder=bindLanding; }
      else if(!state.user.answeredContract){ html=viewContractQuestion(); binder=bindContractQuestion; }
      else if(state.user.contractType==='knitting' && !state.user.knittingAcknowledged){ html=viewKnitting(); binder=bindKnitting; }
      else if(state.user.contractType==='none' && !state.user.contractSigned){ html=viewNoneOption(); binder=bindNoneOption; }
      else if(state.user.contractType==='none' && state.user.contractSigned && !state.user.contractPdfDownloaded){ html=viewContractSigned(); binder=bindContractSigned; }
      else if(state.page==='physical'){ html=viewPhysicalDate(); binder=bindPhysicalDate; }
      else if(state.page==='settings'){ html=viewSettings(); binder=bindSettings; }
      else if(state.page==='catalogs'){ html=viewCatalogs(); binder=bindCatalogs; }
      else if(state.page==='support'){ html=viewSupport(); binder=bindSupport; }
      else if(state.page==='video'){ html=viewVideo(); binder=bindVideo; }
      else if(state.page==='type'){ html=viewType(); binder=bindType; }
      else if(state.page==='tracks'){ html=viewTracks(); binder=bindTracks; }
      else if(state.page==='cover'){ html=viewCover(); binder=bindCover; }
      else { html=viewDashboard(); binder=bindDashboard; }

      app.innerHTML = html;
      if(binder) binder();
      document.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_KEY) || 'dark');
    }

    function bindLogin(){

          setProg(30); schoolUrl = await uploadFile(photoSchool, `${base}/foto_escola_${safeName(photoSchool.name)}`); playSound('sucesso');
          if(musicFile){ setProg(50); musicUrl = await uploadFile(musicFile, `${base}/musica_${safeName(musicFile.name)}`); playSound('sucesso'); }

Nome completo: ${full}

WhatsApp: ${whats}
E-mail: ${mail}
TikTok: ${tiktok}
Série escolar: ${grade}
Aluno da escola do dono da Tucano: ${schoolOwner}

Por que se interessou na Tucano:
${interest}

Por que faz música:
${why}

Data da candidatura: ${new Date().toLocaleString('pt-BR')}

Foto do rosto: ${faceUrl}
Foto em frente à escola: ${schoolUrl}
Música: ${musicUrl || '(nenhuma)'}
Discord: ${discord}
Bairro: ${bairro}
Rua: ${rua}
Escola: ${schoolName}
Contato preferido: ${contact}`;

          apps.push({ id:applyId, art, full, mail, date:new Date().toISOString() });

    function getContractPdfUrl(user){
      try{
        const sb = getSupabase();
        const path = `${safePathUser(user.username)}/contrato.pdf`;
        const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
        return data && data.publicUrl ? data.publicUrl : null;

      const url = getContractPdfUrl(state.user);

      $('#pdf-dl').addEventListener('click', async ()=>{

          if(!res.ok) throw new Error('HTTP '+res.status);

          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `contrato_${safePathUser(state.user.username)}.pdf`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
          btn.disabled=false; btn.innerHTML='<i class="fas fa-file-pdf"></i> Baixar PDF';
        }catch(e){
          alert('Não foi possível baixar o PDF (bloqueio CORS ou arquivo ausente). Abra o link manualmente ou avise o admin.');

    function renderReleaseCard(r, dimmed){

        </div>`;

    function bindDashboard(){
      startStatusPolling();

      $('#refresh-status').addEventListener('click', async ()=>{
        const btn=$('#refresh-status'); const old=btn.innerHTML;
        btn.innerHTML='<span class="spinner"></span>';
        await refreshReleaseStatuses(); btn.innerHTML=old;
      });
      $('#hamb').addEventListener('click', (e)=>{ e.stopPropagation(); $('#hmenu').classList.toggle('open'); playSound('botao'); });
      const onDocClick = (e)=>{
        const menu = $('#hmenu');
        if(menu && !menu.contains(e.target) && e.target.id !== 'hamb') menu.classList.remove('open');
        $$('.kebab-menu').forEach(m=>{ if(!m.contains(e.target) && !e.target.classList.contains('kebab-btn')) m.remove(); });
      };
      document.addEventListener('click', onDocClick);

      const bindMenu = (id, action, blockedFlag)=>{
        const el=$(id); if(!el) return;
        el.addEventListener('click', ()=>{
          playSound('botao');
          if(blockedFlag){ alert('Conta bloqueada. Não é possível realizar esta ação.'); return; }
          action();
          const m=$('#hmenu'); if(m) m.classList.remove('open');
        });
      };
      const blocked = isBlocked();
      bindMenu('#m-new', ()=>startNewRelease(), blocked);
      bindMenu('#m-sup', ()=>{ state.page='support'; render(); }, blocked);
      bindMenu('#m-vid', ()=>{ state.page='video'; render(); }, blocked);
      bindMenu('#m-cat', ()=>{ state.catalog='releases'; state.page='catalogs'; render(); }, false);
      bindMenu('#m-set', ()=>{ state.page='settings'; render(); }, false);
      bindMenu('#m-app', ()=>{ alert('Use o menu do navegador para "Adicionar à tela inicial".'); }, false);
      bindMenu('#m-out', ()=>{
        stopStatusPolling();
        state.user=null;
        localStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_LEGACY_KEY);
        state.page='landing'; render();
      }, false);

      const newRel = $('#new-rel');
      if(newRel) newRel.addEventListener('click', ()=>{
        playSound('botao');
        if(isBlocked()){ alert('Conta bloqueada. Não é possível criar release.'); return; }
        startNewRelease();
      });
      const manageBtn = $('#manage-band');
      if(manageBtn) manageBtn.addEventListener('click', ()=>{ if(isBlocked()) return; openBandManager(); });
      const reviveBtn = $('#revive-btn');
      if(reviveBtn) reviveBtn.addEventListener('click', ()=>{
        if(!confirm('Revigorar reativa a conta apenas localmente. Fonogramas removidos no servidor não serão reativados automaticamente. Continuar?')) return;
        state.user.disabled=false; state.user.rescinded=false;
        persistUser(); render();
      });

      $$('.edit-rel').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(isBlocked()){ alert('Conta bloqueada.'); return; }
          const id=btn.dataset.id;
          const r=(state.user.releases||[]).find(x=>x.id===id); if(!r) return;
          state.draft = JSON.parse(JSON.stringify(r));
          state.page='tracks'; render();
        });
      });

      $$('.kebab-btn').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          $$('.kebab-menu').forEach(m=>m.remove());
          const id=btn.dataset.id;
          const menu=document.createElement('div');
          menu.className='kebab-menu open';
          menu.style.position='absolute'; menu.style.bottom='40px'; menu.style.right='8px';
          menu.innerHTML = `
            <button class="kebab-item" data-act="edit"><i class="fas fa-pen"></i> Editar</button>
            <button class="kebab-item" data-act="takedown"><i class="fas fa-arrow-down"></i> Takedown</button>
            <button class="kebab-item danger" data-act="delete"><i class="fas fa-trash"></i> Excluir</button>`;
          btn.parentElement.appendChild(menu);
          menu.querySelectorAll('.kebab-item').forEach(item=>{
            item.addEventListener('click', async (ev)=>{
              ev.stopPropagation(); menu.remove();
              if(isBlocked()){ alert('Conta bloqueada.'); return; }
              try{ await handleReleaseAction(id, item.dataset.act); }
              catch(err){ alert('Erro: '+err.message); }
            });
          });
        });
      });
    }
    async function handleReleaseAction(id, act){
      const r=(state.user.releases||[]).find(x=>x.id===id); if(!r) return;
      if(act==='edit'){ state.draft=JSON.parse(JSON.stringify(r)); state.page='tracks'; render(); return; }
      if(act==='takedown'){
        if(!confirm('Tem certeza que deseja fazer o takedown? Essa ação ainda é reversível.')) return;
        await uploadText(`Takedown solicitado em ${new Date().toLocaleString('pt-BR')} pelo usuário ${state.user.username}.\nRelease: ${r.title}\n`, `${r.basePath}/takedown.txt`);
        alert('Takedown solicitado. O efeito final depende do admin.');
        return;
      }
      if(act==='delete'){
        if(!confirm('Tem certeza de que deseja excluir? Essa ação é irreversível.')) return;
        const n1 = prompt('Digite o nome do lançamento para confirmar:');
        if(n1 !== r.title){ alert('Nome incorreto.'); return; }
        const n2 = prompt('Digite "delete my release." para confirmar:');
        if(n2 !== 'delete my release.'){ alert('Confirmação incorreta.'); return; }
        await deleteFolderFiles(r.basePath);
        await uploadText('Lançamento excluído pelo artista.', `${r.basePath}/EXCLUA`);
        state.user.releases = (state.user.releases||[]).filter(x=>x.id!==id);
        persistUser(); render();
      }
    }

    function viewTracks(){
      if(isBlocked()) return renderBlockedScreen();
      const d = state.draft;
      const type = d.type;
      const max = type==='single'?3:type==='ep'?6:50;
      const artists = (state.user.artists || []).concat([state.user.artistName]).filter(Boolean);
      const uniqArtists = [...new Set(artists)];
      return `
        <div class="min-h-screen p-4 py-8">
          <div class="max-w-3xl mx-auto fade-in">
            <div class="flex items-center justify-between mb-6">
              <h1 class="text-2xl font-bold">Faixas - ${esc((type||'').toUpperCase())}</h1>
              <button id="bk" class="btn-secondary"><i class="fas fa-arrow-left"></i> Voltar</button>
            </div>
            <div id="tracks-container" class="space-y-4">${d.tracks.map((t,i)=>trackCard(t,i,uniqArtists)).join('')}</div>
            <button id="add-t" class="btn-secondary w-full mt-4" ${d.tracks.length>=max?'disabled':''}><i class="fas fa-plus"></i> Adicionar faixa</button>

    function trackCard(t, i, artists){
      return `
        <div class="glass p-4 fade-in" data-idx="${i}">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold">Faixa ${i+1}</h3>
            <button class="rm-t btn-danger" style="padding:.3rem .5rem" data-idx="${i}"><i class="fas fa-trash"></i></button>
          </div>
          <div class="space-y-3">
            <div><label>Título *</label><input class="t-title" type="text" value="${esc(t.title)}"></div>
            <div>
              <label>Arquivo de áudio * (MP3/WAV)</label>
              <input class="t-file" type="file" accept=".mp3,.wav">
              <p class="text-xs text-slate-400 mt-1">${t.file ? '📁 '+esc(t.file.name) : (t.fileName ? '📁 '+esc(t.fileName)+' (já no servidor)' : 'Nenhum arquivo')}</p>
            </div>
            <div>
              <label>Artista principal *</label>
              <select class="t-artist"><option value="">Selecione</option>${artists.map(a=>`<option value="${esc(a)}" ${t.artist===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
            </div>
            <div><label>Artista featured</label><input class="t-feat" type="text" value="${esc(t.feat)}"></div>
            <div><label>Compositores *</label><input class="t-composers" type="text" value="${esc(t.composers)}"></div>
            <div><label>ISRC</label><input class="t-isrc" type="text" value="${esc(t.isrc)}"></div>
            <label class="flex items-center gap-2 cursor-pointer"><input class="t-explicit" type="checkbox" ${t.explicit?'checked':''}><span class="text-sm">Conteúdo explícito</span></label>
          </div>
        </div>`;
    }
    function bindTracks(){
      if(isBlocked()){ bindBlockedBack(); return; }
      const d = state.draft;
      const objectUrls = [];
      const revokeAll = ()=>{ objectUrls.forEach(u=>URL.revokeObjectURL(u)); objectUrls.length=0; };
      $('#bk').addEventListener('click', ()=>{ revokeAll(); state.page='type'; render(); });

      const collect = ()=>{
        $$('#tracks-container > div').forEach(card=>{
          const i = +card.dataset.idx;
          const t = d.tracks[i] || emptyTrack();
          t.title = card.querySelector('.t-title').value;
          t.artist = card.querySelector('.t-artist').value;
          t.feat = card.querySelector('.t-feat').value;
          t.composers = card.querySelector('.t-composers').value;
          t.isrc = card.querySelector('.t-isrc').value;
          t.explicit = card.querySelector('.t-explicit').checked;
        });
      };

      $$('.t-file').forEach(inp=>{
        inp.addEventListener('change', ()=>{
          const card = inp.closest('[data-idx]');
          const i = +card.dataset.idx;
          const f = inp.files[0];
          if(!f) return;
          const ext = f.name.split('.').pop().toLowerCase();
          if(!['mp3','wav'].includes(ext)){ alert('Formato inválido. Use MP3 ou WAV.'); inp.value=''; return; }
          const url = URL.createObjectURL(f);
          objectUrls.push(url);
          const audio = new Audio(url);
          audio.addEventListener('loadedmetadata', ()=>{
            const dur = audio.duration;
            if(!isFinite(dur) || dur < 30 || dur > 2700){ alert('Duração fora do permitido (30s a 45min).'); inp.value=''; return; }
            d.tracks[i].file = f;
            d.tracks[i].duration = dur;
            const p = card.querySelector('.text-xs');
            if(p) p.textContent = '📁 '+f.name;
          });
          audio.addEventListener('error', ()=>{ alert('Não foi possível ler o áudio.'); inp.value=''; });
        });
      });

      $$('.rm-t').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const i = +btn.dataset.idx;
          collect();
          d.tracks.splice(i,1);
          if(d.tracks.length===0) d.tracks.push(emptyTrack());
          revokeAll(); render();
        });
      });

      const addBtn = $('#add-t');
      if(addBtn) addBtn.addEventListener('click', ()=>{ collect(); d.tracks.push(emptyTrack()); revokeAll(); render(); });

      $('#next').addEventListener('click', ()=>{
        collect();
        const err = $('#track-error'); err.style.display='none';
        const type = d.type;
        const min = type==='single'?1:type==='ep'?4:7;
        const max = type==='single'?3:type==='ep'?6:50;
        if(d.tracks.length < min){ err.textContent=`Mínimo de ${min} faixas.`; err.style.display='block'; return; }
        if(d.tracks.length > max){ err.textContent=`Máximo de ${max} faixas.`; err.style.display='block'; return; }
        for(let i=0;i<d.tracks.length;i++){
          const t = d.tracks[i];
          if(!t.title || (!t.file && !t.fileName) || !t.artist || !t.composers){
            err.textContent = `Preencha todos os campos obrigatórios da faixa ${i+1}.`;
            err.style.display='block'; return;
          }
        }
        if(type==='ep'){
          const totalDur = d.tracks.reduce((s,t)=>s+(t.duration || 0), 0);
          if(totalDur < 600){ err.textContent='EP precisa de pelo menos 10 minutos totais.'; err.style.display='block'; return; }
        }
        revokeAll();
        state.page='cover'; render();
      });
    }

              ${!isKnitting && !isTucano ? `<div><label>Detentor ℗ *</label><input id="f-ph" type="text" value="${esc(d.ph||'')}"></div>` : ''}
              ${!isKnitting ? `<div><label>Ano de produção © *</label><input id="f-cy" type="number" min="1900" max="${yearNow}" value="${esc(d.cy||yearNow)}"></div>` : ''}
              ${!isKnitting ? `<div><label>Detentor © *</label><input id="f-ch" type="text" value="${esc(d.ch||'')}"></div>` : ''}
              <div><label>Data de lançamento * (mín. 14 dias)</label><input id="f-date" type="date" min="${datePlus(14)}" value="${esc(d.releaseDate||'')}"></div>

            <div id="cover-error" class="alert-box mt-3" style="display:none"></div>

    function bindCover(){
      if(isBlocked()){ bindBlockedBack(); return; }
      const d = state.draft;
      $('#bk').addEventListener('click', ()=>{ state.page='tracks'; render(); });
      let coverFile = null; let coverDimsOk = false; let previewUrl = null;

      $('#cov-in').addEventListener('change', ()=>{
        const f = $('#cov-in').files[0]; if(!f) return;
        if(!['image/png','image/jpeg'].includes(f.type)){ alert('Formato inválido. Use PNG ou JPG.'); $('#cov-in').value=''; return; }
        if(previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(f);
        const img = new Image();
        img.onload = ()=>{
          if(img.width !== 3000 || img.height !== 3000){ alert('A capa precisa ter exatamente 3000x3000 pixels.'); $('#cov-in').value=''; URL.revokeObjectURL(previewUrl); previewUrl=null; return; }
          coverFile=f; coverDimsOk=true;
          $('#cov-label').textContent=f.name;
          $('#cov-img').src=previewUrl;
          $('#cov-preview').style.display='block';
        };
        img.onerror = ()=>{ alert('Erro ao carregar imagem.'); $('#cov-in').value=''; };
        img.src = previewUrl;
      });

      $('#sub').addEventListener('click', async ()=>{
        if(isBlocked()){ alert('Conta bloqueada.'); return; }
        const err = $('#cover-error'); err.style.display='none';
        const title = $('#f-title').value.trim();
        const genre = $('#f-genre').value;
        const releaseDate = $('#f-date').value;
        if(!coverFile){ err.textContent='Envie a capa 3000x3000.'; err.style.display='block'; return; }
        if(!coverDimsOk){ err.textContent='Capa precisa ter exatamente 3000x3000.'; err.style.display='block'; return; }
        if(!title){ err.textContent='Preencha o título.'; err.style.display='block'; return; }
        if(!genre){ err.textContent='Selecione o gênero.'; err.style.display='block'; return; }
        if(!releaseDate){ err.textContent='Preencha a data de lançamento.'; err.style.display='block'; return; }
        const minDate = datePlus(14);
        if(releaseDate < minDate){ err.textContent=`Data mínima: ${fmtDate(minDate)}.`; err.style.display='block'; return; }

        const isKnitting = state.user.contractType === 'knitting';
        const isTucano = state.user.contractType === 'tucano';
        const yearNow = new Date().getFullYear();
        d.title=title; d.upc=$('#f-upc').value.trim(); d.genre=genre;
        d.subgenre=$('#f-sub').value.trim(); d.releaseDate=releaseDate;
        if(!isKnitting){
          d.py = $('#f-py') ? $('#f-py').value : yearNow;
          d.ph = isTucano ? 'Lantuns' : ($('#f-ph') ? $('#f-ph').value.trim() : '');
          d.cy = $('#f-cy') ? $('#f-cy').value : yearNow;
          d.ch = $('#f-ch') ? $('#f-ch').value.trim() : '';
        } else {
          d.py=yearNow; d.ph='Knitting'; d.cy=yearNow; d.ch='Knitting';
        }

        const btn=$('#sub'); const old=btn.innerHTML;
        btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Enviando...';

        try{
          const releaseId = uid().slice(0,8).replace(/[^a-zA-Z0-9]/g,'').slice(0,8) || String(Date.now());
          const basePath = `${safePathUser(state.user.username)}/${releaseId}`;
          const prog = $('#cov-prog'); if(prog) prog.style.display='block';
          const fill = $('#cov-fill'); if(fill) fill.style.width='30%';

          const coverUrl = await uploadFile(coverFile, `${basePath}/capa_${safeName(coverFile.name)}`);
          playSound('sucesso');
          if(fill) fill.style.width='60%';

          const trackUrls = [];
          for(let i=0;i<d.tracks.length;i++){
            const t = d.tracks[i];
            if(t.file){
              const nn = String(i+1).padStart(2,'0');
              const url = await uploadFile(t.file, `${basePath}/faixa${nn}_${safeName(t.file.name)}`);
              trackUrls.push(url); playSound('sucesso');
            } else {
              trackUrls.push(t.url || '');
            }
          }
          if(fill) fill.style.width='85%';

          let meta = `Lançamento novo

Tipo: ${d.type.toUpperCase()}
Título: ${d.title}
UPC/EAN: ${d.upc || ''}
Capa: ${coverFile.name}
Gênero principal: ${d.genre}
Subgênero: ${d.subgenre || ''}
Ano de produção dos direitos ℗: ${d.py}
Detentor ℗: ${d.ph}
Ano de produção do ©: ${d.cy}
Detentor ©: ${d.ch}
Data de lançamento: ${fmtDate(d.releaseDate)}

DADOS DO ARTISTA
Nome completo: ${state.user.fullName || ''}
Nome artístico: ${state.user.artistName || ''}
E-mail: ${state.user.email || ''}
WhatsApp: ${state.user.whatsapp || ''}
Usuário: ${state.user.username}
Data do envio: ${new Date().toLocaleString('pt-BR')}

`;
          d.tracks.forEach((t,i)=>{
            meta += `Música ${i+1}
Título: ${t.title}
Artista principal: ${t.artist}
Artista featured: ${t.feat || ''}
Compositores: ${t.composers}
ISRC: ${t.isrc || ''}
Explícito: ${t.explicit ? 'Sim (Parental Advisory)' : 'Não'}
Nome do arquivo: ${t.file ? t.file.name : (t.fileName || '')}

`;
          });
          await uploadText(meta, `${basePath}/metadados.txt`);

          const statusTxt = `Tipo: Som
ID: ${releaseId}
Status: Revisão
Motivo: `;
          await uploadText(statusTxt, `${basePath}/status.txt`);
          if(fill) fill.style.width='100%';

          const release = {
            id: releaseId, title: d.title, type: d.type, genre: d.genre,
            releaseDate: d.releaseDate, coverUrl, trackUrls, basePath,
            metaPath: `${basePath}/metadados.txt`, status:'Revisão', motivo:'',
            createdAt: new Date().toISOString(),
            tracks: d.tracks.map((t,i)=>({
              title:t.title, artist:t.artist, feat:t.feat||'', composers:t.composers,
              isrc:t.isrc||'', explicit:!!t.explicit,
              fileName: t.file ? t.file.name : (t.fileName||''),
              url: trackUrls[i]||''
            }))
          };

          state.user.releases = state.user.releases || [];
          state.user.releases.push(release);
          persistUser();
          playSound('sucessao');
          state.draft = {};
          state.page='dashboard'; render();
        }catch(e){
          console.error(e);
          err.textContent = 'Erro: '+e.message; err.style.display='block';
          btn.disabled=false; btn.innerHTML=old;
          const prog=$('#cov-prog'); if(prog) prog.style.display='none';
        }
      });
    }

    function bindVideo(){

      const allTracks = [];

        const list = Array.isArray(r.tracks) ? r.tracks : [];

      });
      $('#v-trk').addEventListener('change', ()=>{ $('#v-area').style.display = $('#v-trk').value !== '' ? 'block' : 'none'; });

      $('#v-cov').addEventListener('change', ()=>{ const f=$('#v-cov').files[0]; $('#v-cov-label').textContent = f ? f.name : 'Escolher capa'; });

      $('#v-end').addEventListener('click', async ()=>{
        if(isBlocked()){ alert('Conta bloqueada.'); return; }
        const idx=$('#v-trk').value; const track=allTracks[+idx];
        const file=$('#v-file').files[0]; const cov=$('#v-cov').files[0];
        const plats=$$('.v-plat:checked').map(c=>c.value);
        const date=$('#v-date').value; const time=$('#v-time').value;

        if(!track){ err.textContent='Selecione a música.'; err.style.display='block'; return; }

        if(!['mp4','mov'].includes(file.name.split('.').pop().toLowerCase())){ err.textContent='Vídeo deve ser MP4 ou MOV.'; err.style.display='block'; return; }
        if(!cov){ err.textContent='Envie a capa.'; err.style.display='block'; return; }

        if(date < datePlus(28)){ err.textContent=`Data mínima: ${fmtDate(datePlus(28))}.`; err.style.display='block'; return; }
        if(!time){ err.textContent='Escolha o horário.'; err.style.display='block'; return; }

        const btn=$('#v-end'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';

          const vid = String(Math.floor(Math.random()*90000)+10000);

          const videoUrl = await uploadFile(file, `${base}/video_${safeName(file.name)}`); playSound('sucesso');
          const coverUrl = await uploadFile(cov, `${base}/capa_${safeName(cov.name)}`); playSound('sucesso');

          const txt = `Videoclipe novo

Release original: ${track.releaseTitle}

Plataformas: ${plats.join(', ')}

Horário: ${time}

DADOS DO ARTISTA
Nome completo: ${state.user.fullName || ''}
Nome artístico: ${state.user.artistName || ''}
E-mail: ${state.user.email || ''}
WhatsApp: ${state.user.whatsapp || ''}
Usuário: ${state.user.username}
Data do envio: ${new Date().toLocaleString('pt-BR')}
Vídeo: ${videoUrl}
Capa: ${coverUrl}`;
          await uploadText(txt, `${base}/metadados.txt`);

          const statusTxt = `Tipo: Vídeo
ID: ${vid}
Status: Revisão
Motivo: `;
          await uploadText(statusTxt, `${base}/status.txt`);

          state.user.videoReleases = state.user.videoReleases || [];
          state.user.videoReleases.push({
            id:vid, title:track.title, releaseTitle:track.releaseTitle,
            videoUrl, coverUrl, platforms:plats, releaseDate:date, time,
            status:'Revisão', motivo:'', basePath:base, createdAt:new Date().toISOString()
          });
          persistUser();
          playSound('sucessao'); alert('Videoclipe enviado para revisão!');
          state.page='dashboard'; render();
        }catch(e){ err.textContent='Erro: '+e.message; err.style.display='block'; }
        finally{ btn.disabled=false; btn.innerHTML='<i class="fas fa-paper-plane"></i> Enviar videoclipe'; }
      });
    }

Usuário: ${state.user.username}
Data da rescisão: ${new Date().toLocaleString('pt-BR')}

O Artista rescindiu o contrato com a Tucano. Todos os fonogramas distribuídos devem ser removidos das plataformas.`;
          await uploadText(txt, `${safePathUser(state.user.username)}/rescisao.txt`);
          state.user.rescinded = true; persistUser();
          alert('Rescisão registrada no Supabase. A remoção efetiva depende do admin.');
          render();
        }catch(e){ alert('Erro ao enviar rescisao.txt: '+e.message); btn.disabled=false; btn.innerHTML=old; }
      });

      $('#delete-acc').addEventListener('click', async ()=>{
        playSound('alerta');
        if(!confirm('Tem certeza de que deseja excluir? Isso resultará em todos os seus fonogramas deletados, você não poderá mais usar a Tucano e é irreversível.\n\nAtenção: o pedido é registrado no Supabase e o estado desta conta é removido deste dispositivo. A exclusão definitiva nos servidores (e do HTML) depende do admin.')) return;
        try{
          const txt = `Exclusão de conta

DADOS DO ARTISTA
Nome completo: ${state.user.fullName || ''}
Nome artístico: ${state.user.artistName || ''}
E-mail: ${state.user.email || ''}
WhatsApp: ${state.user.whatsapp || ''}
Usuário: ${state.user.username}
Data da exclusão: ${new Date().toLocaleString('pt-BR')}

O Artista excluiu sua conta. Tudo deve ser excluído: releases, vídeos, suporte, candidaturas e a própria conta.`;
          await uploadText(txt, `${safePathUser(state.user.username)}/EXCLUA.txt`);
        }catch(e){ alert('Erro ao enviar EXCLUA.txt: '+e.message); }

        // Remove APENAS o delta do localStorage. A conta continua no HTML (fonte de verdade)
        // até o admin remover do HTML.
        const key = normUser(state.user.username);
        clearDelta(key);
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(SESSION_LEGACY_KEY);
        stopStatusPolling();
        state.user = null;
        state.page = 'landing';
        render();
        alert('Estado da conta removido deste dispositivo. A conta permanece no HTML até o admin remover de lá.');
      });
    }

    // ============================================================
    // BANDAS
    // ============================================================
    function openBandManager(){
      if(isBlocked()){ alert('Conta bloqueada.'); return; }
      const members = state.user.bandMembers || [];
      const ov = document.createElement('div'); ov.className='modal-overlay';
      ov.innerHTML = `
        <div class="modal-content">
          <h2 class="text-xl font-bold mb-4">Gerenciar Artistas</h2>
          <div id="bm-list" class="space-y-2 mb-4">
            ${members.map((m,i)=>`<div class="flex items-center justify-between glass p-2"><span>${esc(m)}</span><button class="rm-member btn-danger text-xs" data-i="${i}" style="padding:.2rem .5rem"><i class="fas fa-times"></i></button></div>`).join('')}
            ${members.length === 0 ? '<p class="text-slate-400 text-sm">Nenhum membro.</p>' : ''}
          </div>
          <div class="flex gap-2">
            <input id="bm-new" type="text" placeholder="Nome do artista">
            <button id="bm-add" class="btn-primary text-sm whitespace-nowrap">Adicionar</button>
          </div>
          <button id="bm-close" class="btn-secondary w-full mt-4">Fechar</button>
        </div>`;
      document.body.appendChild(ov);

      const close = ()=>{ ov.remove(); render(); };
      $('#bm-close').addEventListener('click', close);
      $('#bm-add').addEventListener('click', ()=>{
        const v=$('#bm-new').value.trim(); if(!v) return;
        state.user.bandMembers = state.user.bandMembers || [];
        if(!state.user.bandMembers.includes(v)) state.user.bandMembers.push(v);
        if(!state.user.artists) state.user.artists = [];
        if(!state.user.artists.includes(v)) state.user.artists.push(v);
        persistUser(); close();
      });
      ov.querySelectorAll('.rm-member').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const i=+btn.dataset.i;
          state.user.bandMembers.splice(i,1);
          persistUser(); close();
        });
      });
    }

    async function syncBandReleases(){
      if(!state.user || !state.user.isBand) return;
      try{
        const sb = getSupabase();
        const members = state.user.bandMembers || [];
        const seen = new Set((state.user.releases||[]).map(r=>r.basePath));
        for(const m of members){
          const safe = safePathUser(m);
          const { data, error } = await sb.storage.from(BUCKET).list(safe, { limit: 100 });
          if(error || !data) continue;
          for(const folder of data){
            if(!folder.name || folder.name.includes('.')) continue;
            if(['support','applications','senha.txt','fisico.txt','rescisao.txt','EXCLUA.txt'].includes(folder.name)) continue;
            const basePath = `${safe}/${folder.name}`;
            if(seen.has(basePath)) continue;
            const txt = await fetchTextFile(`${basePath}/metadados.txt`);
            if(!txt) continue;
            const titleMatch = txt.match(/Título:\s*(.+)/);
            const typeMatch = txt.match(/Tipo:\s*(.+)/);
            const tracks = [];
            const blocks = txt.split(/Música\s+\d+/i).slice(1);
            blocks.forEach(block=>{
              const get = (k)=>{
                const mm = block.match(new RegExp('^\\s*'+k+'\\s*:\\s*(.*)$','mi'));
                return mm ? mm[1].trim() : '';
              };
              tracks.push({
                title:get('Título'), artist:get('Artista principal'),
                feat:get('Artista featured'), composers:get('Compositores'),
                isrc:get('ISRC'), explicit:/Sim/.test(get('Explícito')),
                fileName:get('Nome do arquivo'), url:''
              });
            });
            state.user.releases = state.user.releases || [];
            state.user.releases.push({
              id: folder.name,
              title: titleMatch ? titleMatch[1].trim() : folder.name,
              type: typeMatch ? typeMatch[1].trim().toLowerCase() : 'single',
              basePath, status:'Revisão', motivo:'', coverUrl:'',
              createdAt: folder.created_at || new Date().toISOString(), tracks
            });
            seen.add(basePath);
          }
        }
        persistUser();
        await refreshReleaseStatuses();
        if(state.page === 'dashboard') render();
      }catch(e){ console.warn('syncBandReleases', e); }
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', ()=>{
      document.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_KEY) || 'dark');

      const sess = localStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_LEGACY_KEY);
      if(sess){
        const acc = getAccount(sess);
        if(acc){ state.user = acc; state.page='dashboard'; }
      }

      const params = new URLSearchParams(location.search);
      const action = params.get('action');
      if(action==='apply') state.page='apply';
      else if(action==='support' && state.user) state.page='support';
      else if(action==='new' && state.user) state.page='type';

      render();

      if(state.user){
        startStatusPolling();
        if(state.user.isBand) syncBandReleases();
      }

      if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
    });
  </script>
</body>
