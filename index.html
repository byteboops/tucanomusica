function getSpeed(){if(!navigator.onLine)return 0;const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;return c?(c.downlink||10):10}
function simulateUpload(cb){const s=getSpeed();if(s===0){cb(0,true);return}let p=0;const i=setInterval(()=>{p+=Math.min(8,Math.max(1,s*0.4));if(p>=100){p=100;clearInterval(i);cb(100,false)}else cb(p,false)},200)}

async function uploadFile(file,path){
  if(!supabaseClient) throw new Error('Supabase não inicializado');
  const {error}=await supabaseClient.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false});
  if(error){ console.error('Erro Supabase:',error); throw new Error('Supabase: '+(error.message||JSON.stringify(error))); }
  const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}
async function uploadText(text,path){
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const file=new File([blob],path.split('/').pop(),{type:'text/plain'});
  return await uploadFile(file,path);
}

function datePlus(days){
  const d=new Date();
  d.setDate(d.getDate()+days);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function normalizeLoginValue(value){ return String(value ?? '').trim().toLowerCase(); }
function findUserByLogin(name){
  const users=loadUsers();
  const target=normalizeLoginValue(name);
  const exactKey=Object.keys(users).find(k => normalizeLoginValue(k) === target);
  if(!exactKey) return null;
  return { key: exactKey, data: users[exactKey] };
}

function bindTrackEditor(){
  $('add-t').onclick=()=>{
    const type=state.draft.type;
    const max=type==='single'?3:type==='ep'?6:50;
    if(state.draft.tracks.length<max){
      state.draft.tracks.push({title:'',isrc:'',file:null,duration:0,artist:'',feat:'',composers:'',explicit:false});
      go('tracks');
    }
  };
  document.querySelectorAll('.rm-t').forEach(b=>b.onclick=(e)=>{state.draft.tracks.splice(+e.currentTarget.dataset.i,1);go('tracks')});
  document.querySelectorAll('.t-title').forEach(inp=>inp.oninput=(e)=>{state.draft.tracks[+e.target.dataset.i].title=e.target.value});
  document.querySelectorAll('.t-isrc').forEach(inp=>inp.oninput=(e)=>{state.draft.tracks[+e.target.dataset.i].isrc=e.target.value});
  document.querySelectorAll('.t-feat').forEach(inp=>inp.oninput=(e)=>{state.draft.tracks[+e.target.dataset.i].feat=e.target.value});
  document.querySelectorAll('.t-comp').forEach(inp=>inp.oninput=(e)=>{state.draft.tracks[+e.target.dataset.i].composers=e.target.value});
  document.querySelectorAll('.t-artist').forEach(sel=>sel.onchange=(e)=>{state.draft.tracks[+e.target.dataset.i].artist=e.target.value});
  document.querySelectorAll('.t-explicit').forEach(cb=>cb.onchange=(e)=>{state.draft.tracks[+e.target.dataset.i].explicit=e.target.checked});
  document.querySelectorAll('.t-new-art').forEach(b=>b.onclick=(e)=>{
    const i=+e.currentTarget.dataset.i;
    const n=prompt('Nome do novo artista:');
    if(n){
      if(!state.user.artists)state.user.artists=[];
      state.user.artists.push(n);
      state.draft.tracks[i].artist=n;
      persistUser();go('tracks');
    }
  });
  document.querySelectorAll('.t-file').forEach(inp=>inp.onchange=(e)=>{
    const i=+e.target.dataset.i,f=e.target.files[0];
    if(!f)return;
    const ext='.'+f.name.split('.').pop().toLowerCase();
    if(!['.mp3','.wav'].includes(ext)){alert('Formato inválido. Use MP3 ou WAV.');e.target.value='';return}
    const a=new Audio();
    a.src=URL.createObjectURL(f);
    a.onloadedmetadata=()=>{
      const d=a.duration;
      if(d<30||d>2700){alert('A música deve ter entre 30 segundos e 45 minutos.');e.target.value='';return}
      state.draft.tracks[i].file=f;
      state.draft.tracks[i].duration=d;
      go('tracks');
    };
  });
  $('bk').onclick=()=>go('type');
  $('next').onclick=()=>{
    const type=state.draft.type;
    const min=type==='single'?1:type==='ep'?4:7;
    const max=type==='single'?3:type==='ep'?6:50;
    const n=state.draft.tracks.length;
    if(n<min){alert(`Mínimo de ${min} músicas.`);return}
    if(n>max){alert(`Máximo de ${max} músicas.`);return}
    const falta=state.draft.tracks.find(t=>!t.title||!t.file||!t.artist||!t.composers);
    if(falta){alert('Preencha título, arquivo, artista principal e compositores de todas as músicas.');return}
    if(type==='ep'){
      const total=state.draft.tracks.reduce((s,t)=>s+(t.duration||0),0);
      if(total<600){alert('EP precisa ter no mínimo 10 minutos totais.');return}
    }
    go('cover');
  };
}

function bindCoverMeta(){
  $('cov-in').onchange=(e)=>{
    const f=e.target.files[0];if(!f)return;
    if(!['image/png','image/jpeg'].includes(f.type)){alert('Formato inválido. Use PNG ou JPG/JPEG.');e.target.value='';return}
    const img=new Image();
    img.onload=()=>{
      if(img.width!==3000||img.height!==3000){alert('A capa deve ter exatamente 3000x3000 pixels.');e.target.value='';return}
      state.draft.coverFile=f;
      $('cov-name').textContent=f.name;
      const pd=$('cov-prog'),pf=$('cov-fill');
      pd.classList.remove('hidden');
      simulateUpload((p,off)=>{
        if(off){alert('Sem conexão. Upload impossível.');pd.classList.add('hidden');return}
        pf.style.width=p+'%';
        if(p===100)setTimeout(()=>pd.classList.add('hidden'),500);
      });
    };
    img.src=URL.createObjectURL(f);
  };
  $('bk').onclick=()=>go('tracks');
  $('sub').onclick=async()=>{
    const d=state.draft;
    d.title=$('f-title').value.trim();
    d.upc=$('f-upc').value.trim();
    d.genre=$('f-genre').value;
    d.subgenre=$('f-sub').value;
    d.copyrightYear=$('f-cy').value.trim();
    d.copyrightHolder=$('f-ch').value.trim();
    d.phonographicYear=$('f-py').value.trim();
    d.phonographicHolder=$('f-ph').value.trim();
    d.releaseDate=$('f-date').value;
    if(!d.title)return alert('Preencha o título.');
    if(!d.coverFile)return alert('Selecione uma capa.');
    if(!d.genre)return alert('Selecione um gênero.');
    if(!d.releaseDate)return alert('Selecione a data.');
    const dt=new Date(d.releaseDate+'T00:00:00');
    const min=new Date();min.setDate(min.getDate()+14);
    if(dt<min)return alert('A data deve ser no mínimo 2 semanas a partir de hoje.');
    $('sub').disabled=true;$('sub').innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Enviando...';
    try{
      const releaseId=uid();
      const basePath=`${state.user.username}/${releaseId}`;

      const coverPath=`${basePath}/capa_${d.coverFile.name}`;
      const coverUrl=await uploadFile(d.coverFile,coverPath);
      d.coverUrl=coverUrl;

      const trackInfos=[];
      for(let i=0;i<d.tracks.length;i++){
        const t=d.tracks[i];
        const trackPath=`${basePath}/faixa${String(i+1).padStart(2,'0')}_${t.file.name}`;
        const trackUrl=await uploadFile(t.file,trackPath);
        trackInfos.push({...t,trackUrl,trackPath});
      }

      const tracksBlock=d.tracks.map((t,i)=>`Música ${i+1}
Título: ${t.title}
Artista principal: ${t.artist}
Artista featured: ${t.feat||''}
Compositores: ${t.composers}
ISRC: ${t.isrc||''}
Explícito: ${t.explicit?'Sim (Parental Advisory)':'Não'}
Nome do arquivo: ${t.file.name}
`).join('\n');
      const metaTexto=`Lançamento novo

Tipo: ${d.type.toUpperCase()}
Título: ${d.title}
UPC/EAN: ${d.upc||''}
Capa: ${d.coverFile.name}
Gênero principal: ${d.genre}
Subgênero: ${d.subgenre||''}
Ano dos direitos ©: ${d.copyrightYear}
Direitos ©: ${d.copyrightHolder}
Ano dos direitos ℗: ${d.phonographicYear}
direitos ℗: ${d.phonographicHolder}
Data de lançamento: ${fmtDate(d.releaseDate)}

DADOS DO ARTISTA
Nome completo: ${state.user.fullName||''}
Nome artístico: ${state.user.artistName||''}
E-mail: ${state.user.email||''}
WhatsApp: ${state.user.whatsapp||''}
Usuário: ${state.user.username}
Data do envio: ${new Date().toLocaleString('pt-BR')}

${tracksBlock}`;

      const metaPath=`${basePath}/metadados.txt`;
      await uploadText(metaTexto,metaPath);

      const rel={
        ...d,
        id:releaseId,
        basePath,
        metaPath,
        coverUrl,
        trackUrls:trackInfos.map(t=>t.trackUrl),
        status:'Em revisão',
        createdAt:new Date().toISOString(),
      };
      if(!state.user.releases)state.user.releases=[];
      state.user.releases.push(rel);
      persistUser();

      alert('Lançamento enviado para revisão!');
      state.draft={};go('dashboard');
    }catch(err){
      console.error(err);
      alert('Erro ao enviar: '+(err.message||err));
      $('sub').disabled=false;$('sub').innerHTML='Mandar para revisão';
    }
  };
}

  (state.user.releases||[]).forEach(r=>(r.tracks||[]).forEach(t=>allTracks.push({...t,releaseTitle:r.title})));
  return `<div class="min-h-screen p-4 md:p-8">
    <div class="glass p-6 md:p-8 max-w-2xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Distribuição de Videoclipe</h2>
        <button id="bk" class="text-slate-400 hover:text-white"><i class="fas fa-arrow-left"></i> Voltar</button>
      </div>
      <div class="mb-4"><label class="block mb-2 font-bold">Selecione a música</label>
        <select id="v-trk"><option value="">Selecione...</option>${allTracks.map((t,i)=>`<option value="${i}">${esc(t.title)} (${esc(t.releaseTitle)})</option>`).join('')}</select>
      </div>
      <div id="v-area" class="hidden">
        <div class="mb-4"><label class="block mb-2 font-bold">Vídeo (MP4/MOV, 720p+, 1920x1080, 24fps)</label><input type="file" id="v-file" accept=".mp4,.mov"></div>
        <div class="mb-4"><label class="block mb-2 font-bold">Capa (PNG/JPG, 1920x1080)</label><input type="file" id="v-cov" accept=".png,.jpg,.jpeg"></div>
        <div class="mb-4"><label class="block mb-2 font-bold">Plataformas</label>
          <div class="grid grid-cols-2 gap-2">${['YouTube','Vevo','Apple Music','Tidal'].map(p=>`<label class="flex items-center gap-2"><input type="checkbox" value="${p}" class="v-plat"> ${p}</label>`).join('')}</div>
        </div>
        <div class="mb-4"><label class="block mb-2 font-bold">Data (mínimo 28 dias)</label><input type="date" id="v-date" min="${datePlus(28)}"></div>
        <div class="mb-4"><label class="block mb-2 font-bold">Horário</label><input type="time" id="v-time"></div>
        <button id="v-end" class="btn-primary px-8 py-4 rounded-xl font-bold text-white w-full"><i class="fas fa-paper-plane mr-2"></i>Mandar para revisão</button>
      </div>
    </div>
  </div>`;
}
function bindVideo(){
  $('bk').onclick=()=>go('dashboard');
  $('v-trk').onchange=(e)=>{$('v-area').classList.toggle('hidden',e.target.value==='')};
  $('v-end').onclick=async()=>{
    const allTracks=[];
    (state.user.releases||[]).forEach(r=>(r.tracks||[]).forEach(t=>allTracks.push({...t,releaseTitle:r.title})));
    const i=$('v-trk').value;if(i==='')return alert('Selecione uma música.');
    const track=allTracks[+i];
    const vf=$('v-file').files[0],vc=$('v-cov').files[0];
    const plats=Array.from(document.querySelectorAll('.v-plat:checked')).map(c=>c.value);
    const date=$('v-date').value,time=$('v-time').value;
    if(!vf)return alert('Selecione o vídeo.');
    if(!vc)return alert('Selecione a capa.');
    if(!plats.length)return alert('Selecione ao menos uma plataforma.');
    if(!date)return alert('Selecione a data.');
    if(!time)return alert('Selecione o horário.');
    const dt=new Date(date+'T00:00:00');
    const min=new Date();min.setDate(min.getDate()+28);
    if(dt<min)return alert('Data deve ser no mínimo 28 dias a partir de hoje.');
    $('v-end').disabled=true;$('v-end').innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Enviando...';
    try{
      const videoId=uid();
      const basePath=`${state.user.username}/video_${videoId}`;

      const videoPath=`${basePath}/video_${vf.name}`;
      const coverPath=`${basePath}/capa_${vc.name}`;
      const videoUrl=await uploadFile(vf,videoPath);
      const coverUrl=await uploadFile(vc,coverPath);

      const meta=`Videoclipe novo

Música: ${track.title}
Release original: ${track.releaseTitle}
Artista principal: ${track.artist||''}
Plataformas: ${plats.join(', ')}
Data de lançamento: ${fmtDate(date)}
Horário: ${time}

DADOS DO ARTISTA
Nome completo: ${state.user.fullName||''}
Nome artístico: ${state.user.artistName||''}
E-mail: ${state.user.email||''}
WhatsApp: ${state.user.whatsapp||''}
Usuário: ${state.user.username}
Data do envio: ${new Date().toLocaleString('pt-BR')}
Vídeo: ${videoUrl}
Capa: ${coverUrl}`;
      await uploadText(meta,`${basePath}/metadados.txt`);

      if(!state.user.videoReleases)state.user.videoReleases=[];
      state.user.videoReleases.push({trackTitle:track.title,videoUrl,coverUrl,platforms:plats,date,time,status:'Em revisão'});
      persistUser();

      alert('Videoclipe enviado!');go('dashboard');
    }catch(e){console.error(e);alert('Erro: '+(e.message||e));}
    $('v-end').disabled=false;$('v-end').innerHTML='<i class="fas fa-paper-plane mr-2"></i>Mandar para revisão';
  };
}

window.addEventListener('DOMContentLoaded',()=>{
  try{
    const saved=localStorage.getItem('tucano_current_user');
    if(saved){
      const users=loadUsers();
      if(users[saved])state.user={username:saved,...users[saved]};
    }
  }catch(e){console.warn(e)}
  render();
});
</script>
</body>
</html>
