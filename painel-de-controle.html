<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f13">
  <title>Painel de Controle - Tucano</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./tucano.png">
  <link rel="apple-touch-icon" href="./tucano.png">

  <style>
    @font-face{font-family:'Kablammo';src:url('./kablammo.ttf') format('truetype');font-display:swap;}
    @font-face{font-family:'TikTok Sans';src:url('./tiktok.ttf') format('truetype');font-display:swap;}
    @font-face{font-family:'Ifood RC';src:url('./tucanomusicaletra.woff2') format('woff2');font-display:swap;}
    :root{--bg-primary:#0b1f13;--bg-secondary:#123a24;--bg-tertiary:#1f5c38;--text-primary:#f0fdf4;--text-secondary:#bbf7d0;--text-muted:#86efac;--border-color:rgba(163,230,53,.18);--accent-blue:#a3e635;--accent-blue-dark:#65a30d;--accent-yellow:#fbbf24;--accent-green:#22c55e;--accent-red:#ef4444;--glass-bg:rgba(18,58,36,.72);--glass-border:rgba(163,230,53,.22);}
    html[data-theme="light"]{--bg-primary:#f0fdf4;--bg-secondary:#dcfce7;--bg-tertiary:#bbf7d0;--text-primary:#052e16;--text-secondary:#14532d;--text-muted:#166534;--border-color:rgba(20,83,45,.2);--glass-bg:rgba(255,255,255,.88);--glass-border:rgba(20,83,45,.22);}
    *{font-family:'Ifood RC',sans-serif;}
    body{background:var(--bg-primary);color:var(--text-primary);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden;}
    h1,h2,h3,.kab{font-family:'Kablammo',cursive;}
    .tts{font-family:'TikTok Sans',sans-serif;}
    .glass{background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:20px;}
    .glow{box-shadow:0 0 40px rgba(163,230,53,.15),0 0 80px rgba(163,230,53,.05);}
    .btn-primary{background:linear-gradient(135deg,#65a30d,#a3e635);color:#052e16!important;border-radius:12px;padding:.75rem 1.5rem;font-weight:700;transition:all .25s ease;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:'Ifood RC',sans-serif;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(163,230,53,.4);}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
    .btn-secondary{background:var(--bg-tertiary);color:var(--text-primary);border-radius:12px;padding:.75rem 1.5rem;font-weight:500;transition:all .25s ease;border:1px solid var(--border-color);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:'Ifood RC',sans-serif;}
    .btn-secondary:hover{background:var(--bg-secondary);border-color:var(--accent-blue);}
    .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff!important;border-radius:12px;padding:.75rem 1.5rem;font-weight:600;transition:all .25s ease;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:'Ifood RC',sans-serif;}
    .btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(239,68,68,.4);}
    .progress-bar{width:100%;height:8px;background:var(--bg-tertiary);border-radius:999px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,#65a30d,#a3e635);border-radius:999px;transition:width .3s ease;width:0%;}
    .grid-card{transition:transform .25s ease,box-shadow .25s ease;}
    .grid-card:hover{transform:scale(1.02);box-shadow:0 10px 40px rgba(0,0,0,.3);}
    .contract-fill{background:rgba(251,191,36,.15);color:#fbbf24;padding:1px 6px;border-radius:4px;font-weight:500;}
    input,select,textarea{background:var(--bg-secondary)!important;border:1px solid var(--bg-tertiary)!important;border-radius:12px!important;padding:.75rem!important;color:var(--text-primary)!important;width:100%;transition:border-color .2s,box-shadow .2s;font-family:'Ifood RC',sans-serif;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-blue)!important;box-shadow:0 0 0 3px rgba(163,230,53,.15);}
    input::placeholder,textarea::placeholder{color:var(--text-muted);}
    label{color:var(--text-secondary);font-size:.875rem;font-weight:500;display:block;margin-bottom:.375rem;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
    .fade-in{animation:fadeIn .5s ease forwards;}
    @keyframes fadeInScale{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
    .fade-in-scale{animation:fadeInScale .4s ease forwards;}
    .hamburger-menu{position:fixed;top:70px;right:16px;width:260px;background:var(--glass-bg);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:16px;padding:8px;z-index:100;display:none;box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .hamburger-menu.open{display:block;animation:fadeInScale .2s ease;}
    .menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;cursor:pointer;transition:background .2s;color:var(--text-primary);font-weight:500;font-size:.9rem;border:none;background:transparent;width:100%;text-align:left;font-family:'Ifood RC',sans-serif;}
    .menu-item:hover{background:rgba(163,230,53,.1);}
    .menu-item.danger{color:#ef4444;}
    .menu-item.danger:hover{background:rgba(239,68,68,.1);}
    .menu-item:disabled{opacity:.4;cursor:not-allowed;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease;}
    .modal-content{background:var(--bg-secondary);border:1px solid var(--glass-border);border-radius:20px;padding:32px;max-width:520px;width:100%;animation:fadeInScale .25s ease;max-height:85vh;overflow-y:auto;}
    .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:600;}
    .release-card-cover{aspect-ratio:1;width:100%;border-radius:12px;object-fit:cover;background:var(--bg-tertiary);}
    .type-card{cursor:pointer;transition:all .25s ease;border:2px solid transparent;}
    .type-card:hover{border-color:var(--accent-blue);transform:translateY(-4px);}
    .kebab-menu{position:absolute;bottom:12px;right:12px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:10px;padding:4px;z-index:10;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4);min-width:150px;}
    .kebab-menu.open{display:block;animation:fadeInScale .15s ease;}
    .kebab-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.85rem;color:var(--text-primary);border:none;background:transparent;width:100%;text-align:left;font-family:'Ifood RC',sans-serif;}
    .kebab-item:hover{background:var(--bg-secondary);}
    .kebab-item.danger{color:#ef4444;}
    .scrollbar-thin::-webkit-scrollbar{width:6px;}
    .scrollbar-thin::-webkit-scrollbar-track{background:transparent;}
    .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:999px;}
    .file-input-wrapper{position:relative;overflow:hidden;display:inline-block;width:100%;}
    .file-input-wrapper input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .alert-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:16px;color:#fca5a5;}
    .warning-box{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:16px;color:#fde68a;}
    .success-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:16px;color:#86efac;}
    .info-box{background:rgba(163,230,53,.1);border:1px solid rgba(163,230,53,.3);border-radius:12px;padding:16px;color:#d9f99d;}
    .sig-canvas{width:100%;height:180px;background:#f8fafc;border:2px dashed var(--border-color);border-radius:12px;touch-action:none;cursor:crosshair;}
    .jungle-texture{background-image:radial-gradient(circle at 20% 30%,rgba(163,230,53,.08),transparent 45%),radial-gradient(circle at 80% 70%,rgba(34,197,94,.08),transparent 45%);}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const SUPABASE_URL = 'https://mjqwiqjojkzobuysziyv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcXdpcWpvamt6b2J1eXN6aXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3Nzc4MzMsImV4cCI6MjEwNjM1MzgzM30.w4zDJdmAOmZBnvfXHZ3YDu2qfiUs_gSOnccY0S2ahG8';
    const BUCKET = 'releases';
    const CACHE_VERSION = 'tucano_gostoso_v4';
    const SESSION_KEY = 'tucano_session_v2';
    const SESSION_LEGACY_KEY = 'sessao_tucano_contas_v1';
    const THEME_KEY = 'tucano_theme';
    const STATE_PREFIX = CACHE_VERSION + '_state_';
    const STATUS_POLL_MS = 30000;

    const GENRES = ['Sertanejo','Country','Pop','Rock','Metal','Hip Hop','Funk','Samba','Pagode','MPB','R&B','Jazz','Eletrônica','Coral','Orquestra','Phonk','Gospel','Forró','Boom Bap','J-pop','K-pop','Trip Hop','Piano','Ambiente','Infantil','Comédia','Música Clássica','Reggae','Louvor','Reggaeton','Dubstep','Halloween/Terror'];
    const STATUS_COLORS = { 'Ao Vivo':{bg:'rgba(163,230,53,.15)',color:'#a3e635'}, 'Aprovado':{bg:'rgba(34,197,94,.15)',color:'#22c55e'}, 'Revisão':{bg:'rgba(251,191,36,.15)',color:'#fbbf24'}, 'Rejeitado':{bg:'rgba(239,68,68,.15)',color:'#ef4444'}, 'Em edição':{bg:'rgba(100,116,139,.15)',color:'#94a3b8'} };
    const LICENSE_OPTIONS = [ { v:'direitos', l:'Direitos Autorais' }, { v:'cc0', l:'CC0' }, { v:'cc-by', l:'CC BY' }, { v:'cc-by-nd', l:'CC BY-ND' } ];
    const state = { user:null, page:'dashboard', draft:{}, catalog:'releases', statusPollTimer:null, statusFetching:false };

    function normUser(u){ return String(u||'').trim().toLowerCase(); }
    function $(sel,ctx){ return (ctx||document).querySelector(sel); }
    function $$(sel,ctx){ return Array.from((ctx||document).querySelectorAll(sel)); }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function fmtDate(d){ if(!d) return ''; try{ const dt = (typeof d==='string' && d.length===10) ? new Date(d+'T12:00:00') : new Date(d); return dt.toLocaleDateString('pt-BR'); }catch(e){ return String(d); } }
    function uid(){ if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
    function datePlus(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
    function safePathUser(u){ return String(u||'anon').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_-]+/g,'_').slice(0,40)||'anon'; }
    function safeName(n){ return String(n||'file').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_').slice(0,80); }
    function normStatus(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
    function displayStatus(s){ const n = normStatus(s); if(n==='ao vivo') return 'Ao Vivo'; if(n==='aprovado') return 'Aprovado'; if(n==='revisao') return 'Revisão'; if(n==='rejeitado') return 'Rejeitado'; if(n==='rascunho') return 'Em edição'; return s || 'Em edição'; }
    function getStatusColor(status){ return STATUS_COLORS[displayStatus(status)] || STATUS_COLORS['Em edição']; }
    function isBlocked(){ const u = state.user; if(!u) return true; return !!(u.disabled || u.rescinded || u.deleted); }
    function generateNumericId(existing){ const used = new Set((existing||[]).map(r=>String(r.id))); let tries=0; while(tries<9000){ const n = 1000+Math.floor(Math.random()*9000); if(!used.has(String(n))) return n; tries++; } for(let n=1000;n<=9999;n++){ if(!used.has(String(n))) return n; } return Date.now()%9000+1000; }

    const DELTA_FIELDS = ['releases','artists','videoReleases','answeredContract','contractType','contractSigned','contractPdfDownloaded','knittingAcknowledged','hasRealContract','disabled','rescinded','deleted','bandMembers','isBand'];
    function loadDelta(username){ try{ const raw = localStorage.getItem(STATE_PREFIX + normUser(username)); if(!raw) return {}; const obj = JSON.parse(raw); return (obj && typeof obj==='object') ? obj : {}; }catch(e){ return {}; } }
    function saveDelta(username, delta){ const clean = {}; for(const k of DELTA_FIELDS){ if(k in delta) clean[k] = delta[k]; } localStorage.setItem(STATE_PREFIX + normUser(username), JSON.stringify(clean)); }
    function clearDelta(username){ localStorage.removeItem(STATE_PREFIX + normUser(username)); }
    function mergeAccount(base, delta){ const merged = { ...base, ...delta }; if(!Array.isArray(merged.releases)) merged.releases = []; if(!Array.isArray(merged.videoReleases)) merged.videoReleases = []; if(!Array.isArray(merged.artists)) merged.artists = []; if(!Array.isArray(merged.bandMembers)) merged.bandMembers = []; return merged; }
    function persistUser(){ if(!state.user) return; const delta = {}; for(const k of DELTA_FIELDS){ if(k in state.user) delta[k] = state.user[k]; } saveDelta(state.user.username, delta); const key = normUser(state.user.username); localStorage.setItem(SESSION_KEY, key); localStorage.setItem(SESSION_LEGACY_KEY, key); }

    let _sb = null;
    function getSupabase(){ if(!window.supabase) throw new Error('Biblioteca do Supabase não carregou.'); if(!_sb) _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); return _sb; }
    async function uploadFile(file, path){ const sb = getSupabase(); const { error } = await sb.storage.from(BUCKET).upload(path, file, { cacheControl:'3600', upsert:true }); if(error) throw new Error('Supabase: '+(error.message||JSON.stringify(error))); const { data } = sb.storage.from(BUCKET).getPublicUrl(path); return data.publicUrl; }
    async function uploadText(text, path){ const blob = new Blob([text], { type:'text/plain;charset=utf-8' }); const file = new File([blob], safeName(path.split('/').pop()), { type:'text/plain' }); return await uploadFile(file, path); }
    async function deleteFolderFiles(folderPath){ const sb = getSupabase(); const { data, error } = await sb.storage.from(BUCKET).list(folderPath); if(error){ console.warn('list error', error); return; } if(!data || !data.length) return; const paths = data.map(f => folderPath + '/' + f.name); const { error: delErr } = await sb.storage.from(BUCKET).remove(paths); if(delErr) console.warn('remove error', delErr); }
    async function fetchTextFile(path){ try{ const sb = getSupabase(); const { data } = sb.storage.from(BUCKET).getPublicUrl(path); if(!data || !data.publicUrl) return null; const res = await fetch(data.publicUrl); if(!res.ok) return null; return await res.text(); }catch(e){ return null; } }
    async function fetchJsonFile(path){ const txt = await fetchTextFile(path); if(!txt) return null; try { return JSON.parse(txt); } catch(e) { return null; } }
    function parseStatusTxt(txt){ if(!txt) return null; const s = txt.match(/^\s*Status\s*:\s*(.*)$/mi); const m = txt.match(/^\s*Motivo\s*:\s*(.*)$/mi); return { status: s ? (s[1].trim() || null) : null, motivo: m ? m[1].trim() : '' }; }

    async function init(){
      document.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_KEY) || 'dark');
      const sess = localStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_LEGACY_KEY);
      if(!sess){ window.location.href = '/login.html'; return; }
      try {
        const base = await loadAccount(sess);
        if(!base){ localStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_LEGACY_KEY); window.location.href = '/login.html'; return; }
        const delta = loadDelta(base.username || sess);
        state.user = mergeAccount(base, delta);
        render(); startStatusPolling(); syncSharedReleases();
      } catch(e) { console.error(e); window.location.href = '/login.html'; }
    }
    async function loadAccount(username){ const safe = safePathUser(username); const json = await fetchJsonFile(`${safe}.json`); if(!json) return null; return json; }

    function render(){
      const app = $('#app'); if(!app) return;
      let html=''; let binder=null;
      if(!state.user.answeredContract){ html=viewContractQuestion(); binder=bindContractQuestion; }
      else if(state.user.contractType==='knitting' && !state.user.knittingAcknowledged){ html=viewKnitting(); binder=bindKnitting; }
      else if(state.user.contractType==='none' && !state.user.contractSigned){ html=viewNoneOption(); binder=bindNoneOption; }
      else if(state.user.contractType==='none' && state.user.contractSigned && !state.user.contractPdfDownloaded){ html=viewContractSigned(); binder=bindContractSigned; }
      else if(state.page==='physical'){ html=viewPhysicalDate(); binder=bindPhysicalDate; }
      else if(state.page==='settings'){ html=viewSettings(); binder=bindSettings; }
      else if(state.page==='catalogs'){ html=viewCatalogs(); binder=bindCatalogs; }
      else if(state.page==='support'){ html=viewSupport(); binder=bindSupport; }
      else if(state.page==='video'){ html=viewVideo(); binder=bindVideo; }
      else if(state.page==='type'){ html=viewType(); binder=bindType; }
      else if(state.page==='cover'){ html=viewCover(); binder=bindCover; }
      else if(state.page==='tracks'){ html=viewTracks(); binder=bindTracks; }
      else { html=viewDashboard(); binder=bindDashboard; }
      app.innerHTML = html;
      if(binder) binder();
    }

    function viewDashboard(){
      const u = state.user; const blocked = isBlocked(); const showRevive = u.disabled || u.rescinded; const releases = (u.releases || []);
      return `
        <div class="min-h-screen" style="background-image:url('./praia.jpg');background-size:cover;background-position:center;background-attachment:fixed;">
          <header class="glass sticky top-0 z-50 mx-2 mt-2 px-4 py-3 flex items-center justify-between" style="background:rgba(11,31,19,0.85)">
            <div class="flex items-center gap-3">
              <img src="./tucano.png" width="48" height="48" style="border-radius:12px" onerror="this.style.display='none'">
              <span class="kab text-lg hidden sm:inline">Tucano Música</span>
            </div>
            <div class="flex items-center gap-2">
              ${u.isBand ? `<button id="manage-band" class="btn-secondary text-sm" ${blocked?'disabled':''}><i class="fas fa-users"></i> <span class="hidden sm:inline">Gerenciar Artistas</span></button>` : ''}
              ${showRevive ? `<button id="revive-btn" class="btn-primary text-sm"><i class="fas fa-heart-pulse"></i> Revigorar</button>` : ''}
              <button id="refresh-status" class="btn-secondary" style="padding:.5rem .75rem" title="Atualizar status"><i class="fas fa-rotate"></i></button>
              <button id="hamb" class="btn-secondary" style="padding:.5rem .75rem"><i class="fas fa-bars"></i></button>
            </div>
          </header>
          <div id="hmenu" class="hamburger-menu">
            <button class="menu-item" id="m-new" ${blocked?'disabled':''}><i class="fas fa-plus"></i> Novo Release</button>
            <button class="menu-item" id="m-sup" ${blocked?'disabled':''}><i class="fas fa-life-ring"></i> Suporte</button>
            <button class="menu-item" id="m-vid" disabled><i class="fas fa-video"></i> Distribuição de videoclipe</button>
            <button class="menu-item" id="m-cat"><i class="fas fa-folder"></i> Catálogos</button>
            <button class="menu-item" id="m-set"><i class="fas fa-gear"></i> Configurações</button>
            <button class="menu-item" id="m-app"><i class="fas fa-download"></i> Baixar o App</button>
            <div style="height:1px;background:var(--border-color);margin:6px 12px"></div>
            <button class="menu-item danger" id="m-out"><i class="fas fa-right-from-bracket"></i> Sair</button>
          </div>
          <main class="p-4 max-w-6xl mx-auto">
            ${blocked ? `<div class="warning-box mb-4 text-sm"><i class="fas fa-triangle-exclamation"></i> Conta ${u.disabled?'desativada':u.rescinded?'rescindida':'excluída'}. Envios estão bloqueados.</div>` : ''}
            <div class="flex items-center justify-between mb-6 mt-4 glass p-4">
              <h1 class="kab text-2xl">Meus Lançamentos</h1>
              <button id="new-rel" class="btn-primary" ${blocked?'disabled':''}><i class="fas fa-plus"></i> Novo Release</button>
            </div>
            ${releases.length === 0 ? `
              <div class="glass p-12 text-center fade-in">
                <div style="font-size:3rem">🎵</div>
                <p class="text-slate-400 mt-4">Nenhum lançamento ainda. Crie o primeiro!</p>
              </div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                ${releases.map(r=>renderReleaseCard(r, !!showRevive)).join('')}
              </div>
            `}
          </main>
        </div>`;
    }

    function renderReleaseCard(r, dimmed){
      const st = displayStatus(r.status || 'Em edição');
      const sc = getStatusColor(st);
      return `
        <div class="glass grid-card relative p-3 ${dimmed?'opacity-50':''}" data-release-id="${esc(r.id)}">
          ${r.coverUrl ? `<img src="${esc(r.coverUrl)}" alt="${esc(r.title)}" class="release-card-cover mb-3" loading="lazy">` : `<div class="release-card-cover mb-3 flex items-center justify-center text-4xl">🎵</div>`}
          <h3 class="kab text-sm truncate">${esc(r.title)}</h3>
          <p class="text-xs text-slate-400 mb-1">${esc((r.type||'').toUpperCase())} • ID ${esc(String(r.id))}</p>
          <span class="status-badge" style="background:${sc.bg};color:${sc.color}"><i class="fas fa-circle" style="font-size:6px"></i> ${esc(st)}</span>
          ${st==='Rejeitado' && r.motivo ? `<div class="mt-2 alert-box text-xs">${esc(r.motivo)}</div>` : ''}
          <button class="edit-rel btn-secondary absolute top-2 right-2" style="padding:.4rem .6rem" data-id="${esc(r.id)}"><i class="fas fa-pen"></i></button>

    function bindTracks(){
      if(isBlocked()){ bindBlockedBack(); return; }
      const d = state.draft;
      const objectUrls = [];
      const revokeAll = ()=>{ objectUrls.forEach(u=>URL.revokeObjectURL(u)); objectUrls.length=0; };
      $('#bk').addEventListener('click', ()=>{ revokeAll(); state.page='cover'; render(); });
      const collect = ()=>{ $$('#tracks-container > div').forEach(card=>{ const i = +card.dataset.idx; const t = d.tracks[i] || emptyTrack(); t.title = card.querySelector('.t-title').value; t.artist = card.querySelector('.t-artist').value; t.isFeat = card.querySelector('.t-feat-sel').value; t.feat = card.querySelector('.t-feat').value; t.featSpotify = card.querySelector('.t-feat-spotify').value; t.composers = card.querySelector('.t-composers').value; t.license = card.querySelector('.t-license').value; t.isrc = card.querySelector('.t-isrc').value; t.explicit = card.querySelector('.t-explicit').checked; }); };
      $$('.t-feat-sel').forEach(sel=>{ sel.addEventListener('change', ()=>{ const card = sel.closest('[data-idx]'); const area = card.querySelector('.t-feat-area'); area.style.display = sel.value==='sim' ? 'block' : 'none'; }); });
      $$('.t-file').forEach(inp=>{ inp.addEventListener('change', ()=>{ const card = inp.closest('[data-idx]'); const i = +card.dataset.idx; const f = inp.files[0]; if(!f) return; const ext = f.name.split('.').pop().toLowerCase(); if(!['mp3','wav'].includes(ext)){ alert('MP3 ou WAV.'); inp.value=''; return; } const url = URL.createObjectURL(f); objectUrls.push(url); const audio = new Audio(url); audio.addEventListener('loadedmetadata', ()=>{ const dur = audio.duration; if(!isFinite(dur) || dur < 30 || dur > 2700){ alert('Duração 30s a 45min.'); inp.value=''; return; } d.tracks[i].file = f; d.tracks[i].duration = dur; const p = card.querySelector('.text-xs'); if(p) p.textContent = '📁 '+f.name; }); audio.addEventListener('error', ()=>{ alert('Erro ao ler.'); inp.value=''; }); }); });
      $$('.rm-t').forEach(btn=>{ btn.addEventListener('click', ()=>{ const i = +btn.dataset.idx; collect(); d.tracks.splice(i,1); if(d.tracks.length===0) d.tracks.push(emptyTrack()); revokeAll(); render(); }); });

      $('#save-draft').addEventListener('click', async ()=>{ collect(); d.statusDraft = true; await submitRelease(true); });
      $('#submit-release').addEventListener('click', async ()=>{ collect(); d.statusDraft = false; await submitRelease(false); });
    }

    async function submitRelease(isDraft){
      const d = state.draft; const err = $('#track-error'); if(err) err.style.display='none';
      const type = d.type; const min = type==='single'?1:type==='ep'?4:7; const max = type==='single'?3:type==='ep'?6:50;
      if(!isDraft){
        if(d.tracks.length < min){ err.textContent=`Mínimo ${min}.`; err.style.display='block'; return; }
        if(d.tracks.length > max){ err.textContent=`Máximo ${max}.`; err.style.display='block'; return; }
        for(let i=0;i<d.tracks.length;i++){ const t = d.tracks[i]; if(!t.title || (!t.file && !t.fileName) || !t.artist || !t.composers || !t.license){ err.textContent = `Preencha a faixa ${i+1}.`; err.style.display='block'; return; } }
        if(type==='ep'){ const totalDur = d.tracks.reduce((s,t)=>s+(t.duration || 0), 0); if(totalDur < 600){ err.textContent='EP precisa de 10 min.'; err.style.display='block'; return; } }
      }
      const btn = $('#submit-release') || $('#save-draft'); const old = btn.innerHTML;
      btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Enviando...';
      try{
        const releaseId = String(d.id || generateNumericId(state.user.releases));
        const basePath = `${safePathUser(state.user.username)}/${releaseId}`;
        let coverUrl = d.coverUrl || '';
        if(d.coverFile){ coverUrl = await uploadFile(d.coverFile, `${basePath}/capa_${safeName(d.coverFile.name)}`); }
        const trackUrls = [];
        for(let i=0;i<d.tracks.length;i++){ const t = d.tracks[i]; if(t.file){ const nn = String(i+1).padStart(2,'0'); const url = await uploadFile(t.file, `${basePath}/faixa${nn}_${safeName(t.file.name)}`); trackUrls.push(url); } else { trackUrls.push(t.url || ''); } }
        let meta = `Lançamento ${isDraft?'(rascunho)':''}\n\nID: ${releaseId}\nTipo: ${d.type.toUpperCase()}\nTítulo: ${d.title}\nCapa: ${d.coverFile ? d.coverFile.name : (d.coverUrl ? '(já no servidor)' : '')}\nLicença da Capa: ${d.license} ${d.licenseAttr ? '(Atribuição: '+d.licenseAttr+')' : ''}\nData: ${fmtDate(d.releaseDate)} às ${d.releaseTime} (${d.timezone})\n\nDADOS DO ARTISTA\nNome: ${state.user.fullName || ''}\nArtista: ${state.user.artistName || ''}\nE-mail: ${state.user.email || ''}\nUsuário: ${state.user.username}\nData: ${new Date().toLocaleString('pt-BR')}\n\n`;
        d.tracks.forEach((t,i)=>{ meta += `Música ${i+1}\nTítulo: ${t.title}\nArtista principal: ${t.artist}\nÉ um feat?: ${t.isFeat || 'Não'}\nArtista featured: ${t.feat || ''}\nSpotify do feat: ${t.featSpotify || ''}\nCompositores: ${t.composers}\nLicença: ${t.license || ''}\nISRC: ${t.isrc || ''}\nExplícito: ${t.explicit ? 'Sim' : 'Não'}\nNome do arquivo: ${t.file ? t.file.name : (t.fileName || '')}\n\n`; });
        await uploadText(meta, `${basePath}/metadados.txt`);
        await uploadText(`Tipo: Som\nID: ${releaseId}\nStatus: ${isDraft?'Rascunho':'Revisão'}\nMotivo: `, `${basePath}/status.txt`);
        const release = { id: releaseId, title: d.title || '(sem título)', type: d.type, genre: d.genre, releaseDate: d.releaseDate, releaseTime: d.releaseTime, timezone: d.timezone, license: d.license, licenseAttr: d.licenseAttr, isCompilation: !!d.isCompilation, isFeat: d.isFeat || 'nao', featArtists: d.featArtists || [], coverUrl, trackUrls, basePath, status: isDraft ? 'Em edição' : 'Revisão', motivo:'', createdAt: new Date().toISOString(), tracks: d.tracks.map((t,i)=>({ title:t.title, artist:t.artist, isFeat:t.isFeat||'nao', feat:t.feat||'', featSpotify:t.featSpotify||'', composers:t.composers, license:t.license||'', isrc:t.isrc||'', explicit:!!t.explicit, fileName: t.file ? t.file.name : (t.fileName||''), url: trackUrls[i]||'' })) };
        state.user.releases = (state.user.releases || []).filter(r=>String(r.id)!==String(releaseId));
        state.user.releases.push(release);
        persistUser();
        state.draft = {}; state.page='dashboard'; render();
      }catch(e){ console.error(e); if(err){ err.textContent = 'Erro: '+e.message; err.style.display='block'; } else alert('Erro: '+e.message); btn.disabled=false; btn.innerHTML=old; }
    }

    async function handleReleaseAction(id, act){

    }

    function bindNoneOption(){ const doLogout = ()=>{ stopStatusPolling(); state.user = null; localStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_LEGACY_KEY); window.location.href='/login.html'; }; $('#n-no').addEventListener('click', ()=>{ $('#n-warn').style.display='block'; }); $('#n-yes').addEventListener('click', ()=>{ const u = state.user; showContract(u.fullName||'', u.artistName||'', u.email||'', u.whatsapp||'', u.tiktok||'', u.schoolGrade||''); }); $('#n-login').addEventListener('click', doLogout); }
    function showContract(){ $('#app').innerHTML = `<div class="min-h-screen flex items-center justify-center p-4 jungle-texture"><div class="glass glow p-8 max-w-lg w-full text-center fade-in-scale"><h1 class="kab text-2xl mb-4">Contrato Assinado!</h1><button id="done" class="btn-primary w-full">Continuar</button></div></div>`; $('#done').addEventListener('click', ()=>{ state.user.contractType='tucano'; state.user.answeredContract=true; state.user.contractSigned=true; state.user.contractPdfDownloaded=true; state.user.hasRealContract=true; persistUser(); render(); }); }
    function viewContractSigned(){ return `<div class="min-h-screen flex items-center justify-center p-4 jungle-texture"><div class="glass glow p-8 max-w-lg w-full text-center fade-in-scale"><div style="font-size:4rem">📜</div><h1 class="kab text-2xl mt-4 mb-2">Assinado!</h1><button id="pdf-done" class="btn-secondary w-full">Continuar</button></div></div>`; }
    function bindContractSigned(){ $('#pdf-done').addEventListener('click', ()=>{ state.user.contractPdfDownloaded=true; persistUser(); render(); }); }
    function viewPhysicalDate(){ return `<div class="min-h-screen flex items-center justify-center p-4"><div class="glass p-8"><h1 class="kab text-2xl mb-4">Data Física</h1><button id="bk" class="btn-primary w-full">Voltar</button></div></div>`; }
    function bindPhysicalDate(){ $('#bk').addEventListener('click', ()=>{ state.page='dashboard'; render(); }); }

    const soundCache = {};
    function playSound(name){ try{ const files = { botao:'./botao.mp3', alerta:'./alerta.wav', sucesso:'./sucesso.mp3', sucessao:'./sucessao.mp3' }; const src = files[name]; if(!src) return; if(!soundCache[src]){ soundCache[src] = new Audio(src); soundCache[src].preload='auto'; } const a = soundCache[src].cloneNode(); a.volume = 0.6; a.play().catch(()=>{}); }catch(e){} }

    async function refreshReleaseStatuses(){
      if(!state.user || state.statusFetching) return; state.statusFetching = true; let changed = false;
      try{
        for(const r of (state.user.releases || [])){ if(!r.basePath) continue; const txt = await fetchTextFile(`${r.basePath}/status.txt`); if(!txt) continue; const p = parseStatusTxt(txt); if(!p || !p.status) continue; const disp = displayStatus(p.status); if(disp !== r.status || p.motivo !== (r.motivo||'')){ r.status = disp; r.motivo = p.motivo; changed = true; } }
        if(changed){ persistUser(); if((state.page==='dashboard' || state.page==='catalogs') && !document.activeElement?.matches?.('input,select,textarea')) render(); }
      }catch(e){ console.warn(e); } finally{ state.statusFetching = false; }
    }
    function startStatusPolling(){ if(state.statusPollTimer) return; refreshReleaseStatuses(); state.statusPollTimer = setInterval(()=>{ if(state.user) refreshReleaseStatuses(); }, STATUS_POLL_MS); }
    function stopStatusPolling(){ if(state.statusPollTimer){ clearInterval(state.statusPollTimer); state.statusPollTimer = null; } }

    async function syncSharedReleases(){
      if(!state.user) return;
      try{
        const sb = getSupabase(); const members = (state.user.bandMembers || []).slice(); if(!members.includes(state.user.username)) members.push(state.user.username);
        const seen = new Set((state.user.releases||[]).map(r=>r.basePath)); let count = 0;
        for(const m of members){
          const safe = safePathUser(m); const { data } = await sb.storage.from(BUCKET).list(safe, { limit: 200 }); if(!data) continue;
          for(const folder of data){
            if(!folder.name || folder.name.includes('.')) continue; if(['support','applications'].includes(folder.name)) continue;
            const basePath = `${safe}/${folder.name}`; if(seen.has(basePath)) continue;
            const txt = await fetchTextFile(`${basePath}/metadados.txt`); if(!txt) continue;
            const statusTxt = await fetchTextFile(`${basePath}/status.txt`); const parsed = parseStatusTxt(statusTxt || '');
            const titleMatch = txt.match(/Título:\s*(.+)/); const typeMatch = txt.match(/Tipo:\s*(.+)/); const idMatch = txt.match(/ID:\s*(\d{4})/); const coverMatch = txt.match(/Capa:\s*(.+)/);
            let coverUrl = '';
            if(coverMatch && !coverMatch[1].includes('(já no servidor)')){ const cData = sb.storage.from(BUCKET).getPublicUrl(`${basePath}/${coverMatch[1].trim()}`).data; if(cData) coverUrl = cData.publicUrl; }
            const tracks = []; const blocks = txt.split(/Música\s+\d+/i).slice(1);
            blocks.forEach(block=>{ const get = (k)=>{ const mm = block.match(new RegExp('^\\s*'+k+'\\s*:\\s*(.*)$','mi')); return mm ? mm[1].trim() : ''; }; tracks.push({ title:get('Título'), artist:get('Artista principal'), isFeat: /sim/i.test(get('É um feat?')) ? 'sim' : 'nao', feat:get('Artista featured'), featSpotify:get('Spotify do feat'), composers:get('Compositores'), license:get('Licença'), isrc:get('ISRC'), explicit:/Sim/.test(get('Explícito')), fileName:get('Nome do arquivo'), url:'' }); });
            let releaseId = idMatch ? idMatch[1] : folder.name; if(!/^\d{4}$/.test(String(releaseId))) releaseId = folder.name;
            if((state.user.releases||[]).some(r=>String(r.id)===String(releaseId))) { seen.add(basePath); continue; }
            state.user.releases.push({ id: releaseId, title: titleMatch ? titleMatch[1].trim() : folder.name, type: typeMatch ? typeMatch[1].trim().toLowerCase() : 'single', basePath, status: parsed?.status ? displayStatus(parsed.status) : 'Revisão', motivo: parsed?.motivo || '', coverUrl, tracks });
            seen.add(basePath); count++;
          }
        }
        if(count > 0){ persistUser(); await refreshReleaseStatuses(); if(state.page === 'dashboard' || state.page === 'catalogs') render(); }
      }catch(e){ console.warn(e); }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
