<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Tucano Música — Contrato</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" type="image/png" href="../../tucano.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.glass{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6);transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);transform:scale(1.02)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-size:15px;text-decoration:none}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8}
.btn-outline:hover{border-color:#0ea5e9;color:#0ea5e9}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-backdrop.show{display:flex}
.modal-box{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:28px;max-width:480px;width:100%}
.hidden{display:none !important}
</style>
</head>
<body>

<main class="min-h-screen flex items-center justify-center p-4">
  <div class="glass w-full max-w-lg p-8">
    <h2 class="text-2xl font-bold mb-4 text-center">Você assinou algum contrato com:</h2>
    <div class="space-y-3">
      <button id="c-knit" class="btn btn-outline w-full" type="button">
        <i class="fas fa-file-signature"></i> Knitting Records™
      </button>
      <button id="c-tuc" class="btn btn-primary w-full" type="button">
        <i class="fas fa-dove"></i> Tucano Independente
      </button>
      <button id="c-none" class="btn btn-outline w-full" type="button">
        <i class="fas fa-times"></i> Nenhum
      </button>
    </div>
  </div>
</main>

<div id="modal-liar" class="modal-backdrop">
  <div class="modal-box text-center">
    <div class="text-7xl mb-3">😡</div>
    <h3 class="text-2xl font-bold text-red-500 mb-3">Mentiroso!</h3>
    <p class="text-slate-300 mb-6">Você não tem um contrato registrado. Escolha 'Nenhum' e assine o contrato da Tucano de verdade.</p>
    <button id="liar-ok" class="btn btn-primary w-full" type="button">Entendi</button>
  </div>
</div>

<script>
(function(){
'use strict';
var ACCOUNTS_KEY='tucano_accounts_v2';
var SESSION_KEY='tucano_session_v2';

function normUser(u){ return (u||'').toString().trim().toLowerCase(); }
function loadAccounts(){ try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'{}'); }catch(e){ return {}; } }
function saveAccounts(a){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }

function getUser(){
  try{
    var s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s) return null;
    var acc=loadAccounts();
    return acc[normUser(s.username)]||null;
  }catch(e){ return null; }
}
function persist(u){
  var acc=loadAccounts();
  acc[normUser(u.username)]=u;
  saveAccounts(acc);
}

function liarAlert(){
  if(window.Notification && Notification.permission==='granted'){
    try{ new Notification('Assine primeiro, mentiroso da porra 😡'); }catch(e){}
  }else if(window.Notification && Notification.permission!=='denied'){
    Notification.requestPermission().then(function(p){
      if(p==='granted'){ try{ new Notification('Assine primeiro, mentiroso da porra 😡'); }catch(e){} }
    });
  }
  document.getElementById('modal-liar').classList.add('show');
}

document.addEventListener('DOMContentLoaded',function(){
  var u=getUser();
  if(!u){ window.location.href='../../index.html'; return; }
  if(u.answeredContract){ window.location.href='../../dashboard/dashboard.html'; return; }

  document.getElementById('liar-ok').onclick=function(){
    document.getElementById('modal-liar').classList.remove('show');
  };
  document.getElementById('modal-liar').onclick=function(e){
    if(e.target===this) this.classList.remove('show');
  };

  document.getElementById('c-knit').onclick=function(){
    if(u.hasRealContract!==true){ liarAlert(); return; }
    u.contractType='knitting'; u.answeredContract=true; u.knittingAcknowledged=false;
    persist(u); window.location.href='../knitting/knitting.html';
  };
  document.getElementById('c-tuc').onclick=function(){
    if(u.hasRealContract!==true){ liarAlert(); return; }
    u.contractType='tucano'; u.answeredContract=true; u.contractSigned=true; u.contractPdfDownloaded=true;
    persist(u); window.location.href='../../dashboard/dashboard.html';
  };
  document.getElementById('c-none').onclick=function(){
    u.contractType='none'; u.answeredContract=true; u.contractSigned=false; u.contractPdfDownloaded=false;
    persist(u); window.location.href='../nenhum/nenhum.html';
  };
});
})();
</script>
</body>
</html>
