<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Tucano Música — Candidatura Enviada</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" type="image/png" href="../../tucano.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.glass{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6);transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);transform:scale(1.02)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-size:15px;text-decoration:none}
</style>
</head>
<body>

<main class="min-h-screen flex items-center justify-center p-4">
  <div class="glass w-full max-w-md p-8 text-center">
    <div class="text-6xl mb-4">🐦</div>
    <h2 class="text-2xl font-bold text-green-400 mb-2">Candidatura enviada!</h2>
    <p class="text-slate-300 mb-6">Recebemos sua candidatura. A equipe Tucano vai analisar e entrar em contato.</p>
    <a href="../../index.html" class="btn btn-primary w-full">Voltar ao início</a>
  </div>
</main>

</body>
</html>
