<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Tucano Música — Candidatura</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../tucano.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.glass{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6);transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);transform:scale(1.02)}
input,textarea{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;color:#fff;width:100%;outline:none;font-size:15px;font-family:inherit}
input:focus,textarea:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.2)}
::placeholder{color:#64748b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-size:15px;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8}
.btn-outline:hover{border-color:#0ea5e9;color:#0ea5e9}
.checkbox-custom{width:18px;height:18px;accent-color:#0ea5e9}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none !important}
</style>
</head>
<body>

<main class="min-h-screen flex items-center justify-center p-4">
  <form id="form-apply" class="glass w-full max-w-xl p-6 md:p-8" onsubmit="return false;">
    <h2 class="text-2xl font-bold mb-6 text-sky-400"><i class="fas fa-paper-plane mr-2"></i>Candidatura</h2>
    <div class="space-y-4">
      <input id="ap-full"  type="text"  placeholder="Nome completo *">
      <input id="ap-art"   type="text"  placeholder="Nome artístico *">
      <input id="ap-whats" type="tel"   placeholder="WhatsApp *">
      <input id="ap-mail"  type="email" placeholder="E-mail *">
      <fieldset>
        <legend class="text-sm text-slate-400 mb-2">Você é aluno da escola do dono da Tucano? *</legend>
        <label class="flex items-center gap-2 mb-1"><input type="radio" name="ap-school" value="Sim" class="checkbox-custom"> Sim</label>
        <label class="flex items-center gap-2"><input type="radio" name="ap-school" value="Não" class="checkbox-custom"> Não</label>
      </fieldset>
      <textarea id="ap-interest" rows="2" placeholder="Por que se interessou na Tucano? *"></textarea>
      <textarea id="ap-why"      rows="2" placeholder="Por que faz música? *"></textarea>
      <div>
        <label for="ap-song" class="block text-sm text-slate-400 mb-2">Música de demonstração (.mp3 ou .wav) *</label>
        <input id="ap-song" type="file" accept=".mp3,.wav">
      </div>
      <p id="ap-error" class="text-red-400 text-sm hidden"></p>
      <button id="ap-send" class="btn btn-primary w-full" type="button"><i class="fas fa-check"></i> Enviar Candidatura</button>
      <a href="../index.html" class="btn btn-outline w-full"><i class="fas fa-arrow-left"></i> Voltar</a>
    </div>
  </form>
</main>

<script>
(function(){
'use strict';
var SUPABASE_URL='https://mjqwiqjojkzobuysziyv.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcXdpcWpvamt6b2J1eXN6aXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3Nzc4MzMsImV4cCI6MjEwNjM1MzgzM30.w4zDJdmA[...';
var BUCKET='releases';
var _sb=null;

function getSupabase(){
  if(_sb) return _sb;
  if(!window.supabase||!window.supabase.createClient){
    throw new Error('Biblioteca do Supabase não carregou (verifique a internet).');
  }
  _sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  return _sb;
}
async function uploadFile(file,path){
  var sb=getSupabase();
  var r=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false});
  if(r.error) throw new Error('Supabase: '+(r.error.message||JSON.stringify(r.error)));
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function uploadText(text,path){
  var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  var file=new File([blob],path.split('/').pop(),{type:'text/plain'});
  return await uploadFile(file,path);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function normUser(u){ return (u||'').toString().trim().toLowerCase(); }
function $(s){ return document.querySelector(s); }

document.addEventListener('DOMContentLoaded',function(){
  var send=$('#ap-send');
  var errBox=$('#ap-error');

  send.addEventListener('click',async function(){
    var full=$('#ap-full').value.trim();
    var art=$('#ap-art').value.trim();
    var whats=$('#ap-whats').value.trim();
    var mail=$('#ap-mail').value.trim();
    var interest=$('#ap-interest').value.trim();
    var why=$('#ap-why').value.trim();
    var schoolEl=document.querySelector('input[name="ap-school"]:checked');
    var songFile=$('#ap-song').files[0];

    errBox.classList.add('hidden');
    if(!full||!art||!whats||!mail||!interest||!why||!schoolEl||!songFile){
      errBox.textContent='Preencha todos os campos obrigatórios.';
      errBox.classList.remove('hidden');
      return;
    }
    if(!/^\S+@\S+\.\S+$/.test(mail)){
      errBox.textContent='E-mail inválido.';
      errBox.classList.remove('hidden');
      return;
    }
    var ext=songFile.name.toLowerCase().split('.').pop();
    if(ext!=='mp3'&&ext!=='wav'){
      errBox.textContent='A música deve ser .mp3 ou .wav.';
      errBox.classList.remove('hidden');
      return;
    }

    var oldHtml=send.innerHTML;
    send.disabled=true;
    send.innerHTML='<span class="spinner"></span> Enviando...';

    try{
      var applyId=uid();
      var safeUser=normUser(art).replace(/[^a-z0-9]+/g,'_')||'anon';
      var basePath='applications/'+safeUser+'_'+applyId;
      var songUrl=await uploadFile(songFile,basePath+'/musica_'+songFile.name);
      var txt='Candidatura\n\nNome completo: '+full+'\nNome artístico: '+art+'\nWhatsApp: '+whats+'\nE-mail: '+mail+'\nAluno da escola do dono da Tucano: '+schoolEl.value+'\n\nPor que se interessou na Tucano?\n'+interest+'\n\nPor que faz música?\n'+why;
      await uploadText(txt,basePath+'/candidatura.txt');
      var list=JSON.parse(localStorage.getItem('tucano_applications')||'[]');
      list.push({id:applyId,full:full,art:art,whats:whats,mail:mail,school:schoolEl.value,interest:interest,why:why,songUrl:songUrl,createdAt:Date.now()});
      localStorage.setItem('tucano_applications',JSON.stringify(list));
      window.location.href='./candidatura-ok/candidatura-ok.html';
    }catch(e){
      send.disabled=false;
      send.innerHTML=oldHtml;
      errBox.textContent=e.message||'Erro ao enviar candidatura.';
      errBox.classList.remove('hidden');
    }
  });
});
})();
</script>
</body>
</html>
