<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Entrar na Tucano Música">
  <title>Entrar — Tucano Música</title>

  <meta name="google-adsense-account" content="ca-pub-5813647886625192">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5813647886625192"
     crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="32x32" type="image/svg+xml" href="./pretocon.svg">
  <link rel="apple-touch-icon" href="./Captura_de_tela_2026-11-16_190536-removebg-preview.png">

  <style>
    *{ box-sizing: border-box; margin:0; padding:0; font-family:'Barlow', sans-serif; }
    html, body{ background:#000; color:#e5e5e5; min-height:100vh; }
    body{ display:flex; align-items:center; justify-content:center; padding:16px; }
    .box{ width:100%; max-width:360px; }
    .logo{ display:block; width:72px; height:72px; margin:0 auto 24px; border-radius:6px; }
    h1{ font-size:18px; font-weight:600; text-align:center; margin-bottom:20px; letter-spacing:.2px; }

    label{ display:block; font-size:13px; color:#a3a3a3; margin-bottom:6px; }
    input{
      width:100%; padding:12px 14px; font-size:15px; color:#fff;
      background:#0d0d0d; border:1px solid #262626; border-radius:2px;
      outline:none; transition:border-color .15s;
    }
    input:focus{ border-color:#525252; }
    input::placeholder{ color:#4a4a4a; }
    .field{ margin-bottom:14px; }

    button{
      width:100%; padding:12px 14px; font-size:15px; font-weight:600; cursor:pointer;
      border:none; border-radius:2px; transition:opacity .15s;
    }
    .btn-main{ background:#fff; color:#000; }
    .btn-main:hover{ opacity:.85; }
    .btn-main:disabled{ opacity:.4; cursor:not-allowed; }
    .btn-alt{
      background:transparent; color:#e5e5e5; border:1px solid #262626; margin-top:10px;
    }
    .btn-alt:hover{ background:#0d0d0d; }

    .link-forgot{
      display:block; width:100%; text-align:center; font-size:13px; color:#737373;
      background:none; border:none; cursor:pointer; padding:6px 0; margin-bottom:14px;
    }
    .link-forgot:hover{ color:#a3a3a3; text-decoration:underline; }

    .msg{ font-size:13px; margin-top:10px; text-align:center; min-height:18px; }
    .msg.err{ color:#f87171; }
    .msg.ok{ color:#4ade80; }

    .modal-bg{
      position:fixed; inset:0; background:rgba(0,0,0,.8); display:none;
      align-items:center; justify-content:center; padding:16px; z-index:10;
    }
    .modal-bg.open{ display:flex; }
    .modal{ background:#0d0d0d; border:1px solid #262626; border-radius:2px; padding:24px; max-width:320px; width:100%; text-align:center; }
    .modal p{ font-size:15px; margin-bottom:18px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="./preto_tucano.svg" alt="Tucano" class="logo" onerror="this.style.display='none'">
    <h1>Entrar na Tucano</h1>

    <!-- ===== ETAPA 1: só e-mail ===== -->
    <div id="step-email">
      <div class="field">
        <label for="in-email">E-mail</label>
        <input id="in-email" type="email" placeholder="email@exemplo.com" autocomplete="email" autofocus>
      </div>
      <button id="btn-email-check" class="btn-main">Continuar</button>
      <button id="btn-go-artist" class="btn-alt">Entrar com artista e senha</button>
      <div id="msg-email" class="msg"></div>
    </div>

    <!-- ===== ETAPA 2: senha (vinda do e-mail) ===== -->
    <div id="step-email-pass" style="display:none">
      <button id="btn-forgot-email" class="link-forgot">Esqueci minha senha</button>
      <div class="field">
        <label for="in-email-pass">Senha</label>
        <input id="in-email-pass" type="password" placeholder="Sua senha" autocomplete="current-password">
        <p>Se você for um recém-artista que acabou de ser aprovado pela Tucano Música e está fazendo login pela primeira vez para utilização da conta pela primeira vez, concordará com a nossa <a href="./privacidade.html">política de privacidade</a> ao fazer o login pela primeira vez.</p>
      </div>
      <button id="btn-email-login" class="btn-main">Fazer login</button>
      <button id="btn-email-back" class="btn-alt">Voltar</button>
      <div id="msg-email-pass" class="msg"></div>
    </div>

    <!-- ===== ETAPA 3: só artista ===== -->
    <div id="step-artist" style="display:none">
      <div class="field">
        <label for="in-artist">Nome artístico</label>
        <input id="in-artist" type="text" placeholder="Seu nome artístico" autocomplete="username">
      </div>
      <button id="btn-artist-check" class="btn-main">Continuar</button>
      <button id="btn-go-email" class="btn-alt">Entrar com e-mail e senha</button>
      <div id="msg-artist" class="msg"></div>
    </div>

    <!-- ===== ETAPA 4: senha (vinda do artista) ===== -->
    <div id="step-artist-pass" style="display:none">
      <button id="btn-forgot-artist" class="link-forgot">Esqueci minha senha</button>
      <div class="field">
        <label for="in-artist-pass">Senha</label>
        <input id="in-artist-pass" type="password" placeholder="Sua senha" autocomplete="current-password">
      </div>
      <button id="btn-artist-login" class="btn-main">Fazer login</button>
      <button id="btn-artist-back" class="btn-alt">Voltar</button>
      <div id="msg-artist-pass" class="msg"></div>
    </div>
  </div>

  <!-- Modal esqueci senha -->
  <div id="forgot-modal" class="modal-bg">
    <div class="modal">
      <p>Me chama no zap então.</p>
      <button id="forgot-close" class="btn-main">Fechar</button>
    </div>
  </div>
<noscript>
  <div class="aviso-sem-js" role="alert">
    📂 Esta página lê arquivos do Supabase e <strong>exige JavaScript</strong>
    para exibi-los. Ative o JS para continuar.
    <a href="/faq.html#ativar-js">Como ativar</a>.
  </div>
</noscript>
  <script>
    const SUPABASE_URL = 'https://mjqwiqjojkzobuysziyv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcXdpcWpvamt6b2J1eXN6aXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3Nzc4MzMsImV4cCI6MjEwNjM1MzgzM30.w4zDJdmAOmZBnvfXHZ3YDu2qfiUs_gSOnccY0S2ahG8';
    const BUCKET = 'releases';
    const SESSION_KEY = 'tucano_session_v2';
    const SESSION_LEGACY_KEY = 'sessao_tucano_contas_v1';

    let _sb = null;
    function getSupabase(){
      if(!window.supabase) throw new Error('Biblioteca do Supabase não carregou.');
      if(!_sb) _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return _sb;
    }
    function normUser(u){ return String(u||'').trim().toLowerCase(); }
    function safePathUser(u){
      return String(u||'anon').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_-]+/g,'_').slice(0,40)||'anon';
    }
    async function fetchTextFile(path){
      try{
        const sb = getSupabase();
        const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
        if(!data || !data.publicUrl) return null;
        const res = await fetch(data.publicUrl);
        if(!res.ok) return null;
        return await res.text();
      }catch(e){ return null; }
    }
    async function fetchJsonFile(path){
      const txt = await fetchTextFile(path);
      if(!txt) return null;
      try { return JSON.parse(txt); } catch(e) { return null; }
    }
    async function loadAccountByUser(username){
      const safe = safePathUser(username);
      return await fetchJsonFile(`${safe}.json`);
    }

    // Lista todos os *.json do bucket raiz (com paginação manual)
    async function listAllRootJson(){
      const sb = getSupabase();
      const out = [];
      let offset = 0;
      const limit = 100;
      while(true){
        const { data, error } = await sb.storage.from(BUCKET).list('', { limit, offset, sortBy:{ column:'name', order:'asc' } });
        if(error || !data || !data.length) break;
        for(const f of data){ if(f.name && f.name.endsWith('.json')) out.push(f.name); }
        if(data.length < limit) break;
        offset += limit;
      }
      return out;
    }

    // Busca por e-mail (exato, case-insensitive)
    async function findAccountByEmail(email){
      const wanted = String(email||'').trim().toLowerCase();
      if(!wanted || !/^\S+@\S+\.\S+$/.test(wanted)) return null;
      const files = await listAllRootJson();
      for(const name of files){
        const acc = await fetchJsonFile(name);
        if(!acc) continue;
        const e = String(acc.email||'').trim().toLowerCase();
        if(e === wanted) return acc;
      }
      return null;
    }

    // Busca por nome artístico (exato, case-insensitive, com e sem acento)
    function normStr(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
    async function findAccountByArtist(artist){
      const wanted = normStr(artist);
      if(!wanted) return null;
      const files = await listAllRootJson();
      for(const name of files){
        const acc = await fetchJsonFile(name);
        if(!acc) continue;
        const a = normStr(acc.artistName);
        if(a === wanted) return acc;
      }
      return null;
    }

    function doLogin(account){
      const key = normUser(account.username || '');
      localStorage.setItem(SESSION_KEY, key);
      localStorage.setItem(SESSION_LEGACY_KEY, key);
      window.location.href = '/painel-de-controle.html';
    }

    // ===== Elementos =====
    const stepEmail = document.getElementById('step-email');
    const stepEmailPass = document.getElementById('step-email-pass');
    const stepArtist = document.getElementById('step-artist');
    const stepArtistPass = document.getElementById('step-artist-pass');

    function show(el){
      stepEmail.style.display='none';
      stepEmailPass.style.display='none';
      stepArtist.style.display='none';
      stepArtistPass.style.display='none';
      el.style.display='block';
    }
    function msg(el, text, type){ el.textContent = text||''; el.className = 'msg' + (type?' '+type:''); }

    let pendingEmailAccount = null;
    let pendingArtistAccount = null;

    // ===== Etapa 1: e-mail =====
    document.getElementById('btn-email-check').addEventListener('click', async ()=>{
      const val = document.getElementById('in-email').value.trim();
      const m = document.getElementById('msg-email');
      msg(m,'','');
      if(!val){ msg(m,'Digite seu e-mail.','err'); return; }
      if(!/^\S+@\S+\.\S+$/.test(val)){ msg(m,'E-mail inválido.','err'); return; }
      const btn = document.getElementById('btn-email-check'); btn.disabled=true; btn.textContent='Verificando...';
      try{
        const acc = await findAccountByEmail(val);
        if(!acc){ msg(m,'Não foi encontrada nenhuma conta com esse e-mail.','err'); return; }
        pendingEmailAccount = acc;
        show(stepEmailPass);
        document.getElementById('in-email-pass').focus();
      }catch(e){
        msg(m,'Erro: '+e.message,'err');
      }finally{
        btn.disabled=false; btn.textContent='Continuar';
      }
    });
    document.getElementById('in-email').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btn-email-check').click(); });

    // ===== Etapa 2: senha (email) =====
    document.getElementById('btn-email-login').addEventListener('click', ()=>{
      const pass = document.getElementById('in-email-pass').value;
      const m = document.getElementById('msg-email-pass');
      msg(m,'','');
      if(!pendingEmailAccount){ show(stepEmail); return; }
      if(!pass){ msg(m,'Digite a senha.','err'); return; }
      if(String(pendingEmailAccount.password) !== String(pass)){ msg(m,'Senha incorreta.','err'); return; }
      doLogin(pendingEmailAccount);
    });
    document.getElementById('in-email-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btn-email-login').click(); });
    document.getElementById('btn-email-back').addEventListener('click', ()=>{ pendingEmailAccount=null; document.getElementById('in-email-pass').value=''; show(stepEmail); });

    // ===== Etapa 3: artista =====
    document.getElementById('btn-go-artist').addEventListener('click', ()=>{
      pendingArtistAccount = null;
      show(stepArtist);
      document.getElementById('in-artist').focus();
    });
    document.getElementById('btn-artist-check').addEventListener('click', async ()=>{
      const val = document.getElementById('in-artist').value.trim();
      const m = document.getElementById('msg-artist');
      msg(m,'','');
      if(!val){ msg(m,'Digite seu nome artístico.','err'); return; }
      const btn = document.getElementById('btn-artist-check'); btn.disabled=true; btn.textContent='Verificando...';
      try{
        const acc = await findAccountByArtist(val);
        if(!acc){ msg(m,'Não foi encontrado nenhuma conta com esse nome artístico.','err'); return; }
        pendingArtistAccount = acc;
        show(stepArtistPass);
        document.getElementById('in-artist-pass').focus();
      }catch(e){
        msg(m,'Erro: '+e.message,'err');
      }finally{
        btn.disabled=false; btn.textContent='Continuar';
      }
    });
    document.getElementById('in-artist').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btn-artist-check').click(); });

    // ===== Etapa 4: senha (artista) =====
    document.getElementById('btn-artist-login').addEventListener('click', ()=>{
      const pass = document.getElementById('in-artist-pass').value;
      const m = document.getElementById('msg-artist-pass');
      msg(m,'','');
      if(!pendingArtistAccount){ show(stepArtist); return; }
      if(!pass){ msg(m,'Digite a senha.','err'); return; }
      if(String(pendingArtistAccount.password) !== String(pass)){ msg(m,'Senha incorreta.','err'); return; }
      doLogin(pendingArtistAccount);
    });
    document.getElementById('in-artist-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btn-artist-login').click(); });
    document.getElementById('btn-artist-back').addEventListener('click', ()=>{ pendingArtistAccount=null; document.getElementById('in-artist-pass').value=''; show(stepArtist); });

    // ===== Voltar pro e-mail (a partir da etapa 3) =====
    document.getElementById('btn-go-email').addEventListener('click', ()=>{ show(stepEmail); document.getElementById('in-email').focus(); });

    // ===== Esqueci minha senha (os dois fluxos) =====
    const forgotModal = document.getElementById('forgot-modal');
    ['btn-forgot-email','btn-forgot-artist'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('click', ()=> forgotModal.classList.add('open'));
    });
    document.getElementById('forgot-close').addEventListener('click', ()=> forgotModal.classList.remove('open'));
    forgotModal.addEventListener('click', (e)=>{ if(e.target === forgotModal) forgotModal.classList.remove('open'); });
  </script>
</body>
</html>
