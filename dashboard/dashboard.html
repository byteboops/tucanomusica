<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Tucano Música — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../tucano.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.glass{background:rgba(30,41,59,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#3b82f6);transition:all .2s}
.btn-primary:hover{filter:brightness(1.1);transform:scale(1.02)}
.grid-card{transition:all .2s}
.grid-card:hover{transform:scale(1.02);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-block}
.status-review{background:rgba(251,191,36,.15);color:#fbbf24}
.status-draft{background:rgba(100,116,139,.15);color:#94a3b8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-size:15px;color:#e2e8f0}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8}
.btn-outline:hover{border-color:#0ea5e9;color:#0ea5e9}
#hamb{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;flex-shrink:0;position:relative;z-index:100}
.nav-link{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;color:#94a3b8;cursor:pointer;transition:all .15s;background:transparent;border:none;width:100%;text-align:left;text-decoration:none;font-family:inherit;font-size:inherit}
.nav-link:hover{background:rgba(51,65,85,.5);color:#e2e8f0}
.nav-link.danger{color:#ef4444}
#hmenu{position:absolute;top:calc(100% + 8px);right:0;width:240px;max-height:80vh;overflow-y:auto;z-index:100;flex-direction:column;border-radius:16px;background:rgba(15,23,42,.98);border:1px solid rgba(148,163,184,.15);padding:8px;display:none}
#hmenu.show{display:flex}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-backdrop.show{display:flex}
.modal-box{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:28px;max-width:480px;width:100%}
.hidden{display:none !important}
</style>
</head>
<body>

<main class="min-h-screen p-4">
  <div class="max-w-7xl mx-auto">
    <header class="glass p-4 mb-6 flex items-center justify-between relative">
      <div class="flex items-center gap-3">
        <img src="../tucano.png" alt="Tucano" class="w-12 h-12 rounded-lg object-cover" onerror="this.style.display='none'">
        <h1 class="text-xl font-bold text-sky-400">Tucano Música</h1>
      </div>
      <div style="position:relative">
        <button id="hamb" class="btn btn-outline btn-sm" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
        <nav id="hmenu" class="glass">
          <a href="../novo/tipo.html" class="nav-link"><i class="fas fa-plus-circle"></i> Novo Release</a>
          <a href="../suporte/suporte.html" class="nav-link"><i class="fas fa-life-ring"></i> Suporte</a>
          <a href="../videoclipe/videoclipe.html" class="nav-link"><i class="fas fa-video"></i> Videoclipe</a>
          <button id="m-app" class="nav-link" type="button"><i class="fas fa-mobile-alt"></i> Baixar App</button>
          <hr class="border-slate-700 my-2">
          <button id="m-out" class="nav-link danger" type="button"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </nav>
      </div>
    </header>

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold">Meus Lançamentos</h2>
      <a href="../novo/tipo.html" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Novo</a>
    </div>
    <div id="releases-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    <div id="no-releases" class="glass p-8 text-center text-slate-400 hidden">
      <i class="fas fa-music text-4xl mb-3"></i>
      <p>Você ainda não tem lançamentos.</p>
    </div>
  </div>
</main>

<div id="modal-download" class="modal-backdrop">
  <div class="modal-box text-center">
    <div class="text-6xl mb-3">📱</div>
    <h3 class="text-xl font-bold text-yellow-400 mb-3">Está apenas disponível para Android.</h3>
    <p class="text-slate-300 mb-6">Deseja instalar no Android?</p>
    <div class="flex gap-3">
      <button id="dl-yes" class="btn btn-primary flex-1" type="button">Sim</button>
      <button id="dl-no" class="btn btn-outline flex-1" type="button">Não</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var ACCOUNTS_KEY='tucano_accounts_v2';
var SESSION_KEY='tucano_session_v2';
var DRAFT_KEY='tucano_draft_v1';

function normUser(u){ return (u||'').toString().trim().toLowerCase(); }
function loadAccounts(){ try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'{}'); }catch(e){ return {}; } }
function saveAccounts(a){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }
function getUser(){
  try{
    var s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s) return null;
    var acc=loadAccounts();
    return acc[normUser(s.username)]||null;
  }catch(e){ return null; }
}
function persist(u){
  var acc=loadAccounts();
  acc[normUser(u.username)]=u;
  saveAccounts(acc);
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function closeMenu(){
  document.getElementById('hmenu').classList.remove('show');
}

document.addEventListener('DOMContentLoaded',function(){
  var u=getUser();
  if(!u){ window.location.href='../index.html'; return; }
  if(!u.answeredContract){ window.location.href='../contrato/pergunta/pergunta.html'; return; }
  if(u.contractType==='knitting'&&!u.knittingAcknowledged){ window.location.href='../contrato/knitting/knitting.html'; return; }
  if(u.contractType==='none'&&!u.contractSigned){ window.location.href='../contrato/nenhum/nenhum.html'; return; }
  if(u.contractType==='none'&&u.contractSigned&&!u.contractPdfDownloaded){ window.location.href='../contrato/assinado/assinado.html'; return; }

  if(!u.releases) u.releases=[];

  var grid=document.getElementById('releases-grid');
  var empty=document.getElementById('no-releases');

  function renderReleases(){
    grid.innerHTML='';
    if(!u.releases.length){
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    u.releases.forEach(function(rel){
      var card=document.createElement('div');
      card.className='glass grid-card p-4 cursor-pointer';
      var cover=rel.coverUrl||'../tucano.png';
      var typeLabel=(rel.type||'').toUpperCase();
      var statusCls=rel.status==='Rascunho'?'status-draft':'status-review';
      card.innerHTML=
        '<img src="'+esc(cover)+'" alt="'+esc(rel.title||'Lançamento')+" class=\"w-full aspect-square object-cover rounded-xl mb-3\" onerror=\"this.src='../tucano.png'\" style=\"background:#1e293b\">+
        '<h3 class="font-bold text-sm truncate">'+esc(rel.title||'(sem título)')+'</h3>'+
        '<p class="text-xs text-slate-400 mb-2">'+esc(typeLabel)+'</p>'+
        '<div class="flex items-center justify-between">'+
          '<span class="status-badge '+statusCls+'">'+esc(rel.status||'Em revisão')+'</span>'+
          '<button class="edit-rel btn btn-outline btn-sm" type="button" title="Editar"><i class="fas fa-pen"></i></button>'+
        '</div>';
      card.querySelector('.edit-rel').addEventListener('click',function(ev){
        ev.stopPropagation();
        var tracksClean=(rel.tracks||[]).map(function(t){
          return {
            title:t.title||'', artist:t.artist||'', feat:t.feat||'', composers:t.composers||'', isrc:t.isrc||'', explicit:!!t.explicit,
            fileName:t.fileName||'', duration:t.duration||0, url:t.url||''
          };
        });
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          editId: rel.id,
          type: rel.type,
          title: rel.title,
          releaseDate: rel.releaseDate,
          tracks: rel.tracks||[],
          tracksClean: tracksClean,
          coverUrl: rel.coverUrl||''
        }));
        window.location.href='../novo/novo-faixas/faixas.html';
      });
      grid.appendChild(card);
    });
  }

  renderReleases();

  var hamb=document.getElementById('hamb');
  var menu=document.getElementById('hmenu');
  
  hamb.addEventListener('click',function(ev){
    ev.stopPropagation();
    menu.classList.toggle('show');
  });
  
  document.addEventListener('click',function(ev){
    if(menu.classList.contains('show') && !menu.contains(ev.target) && ev.target!==hamb && !hamb.contains(ev.target)){
      menu.classList.remove('show');
    }
  });
  
  document.getElementById('m-out').addEventListener('click',function(ev){
    ev.preventDefault();
    try{
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(DRAFT_KEY);
    }catch(e){}
    window.location.href='../index.html';
  });

  document.getElementById('m-app').addEventListener('click',function(){
    closeMenu();
    document.getElementById('modal-download').classList.add('show');
  });
  
  document.getElementById('dl-no').addEventListener('click',function(){
    document.getElementById('modal-download').classList.remove('show');
  });
  
  document.getElementById('dl-yes').addEventListener('click',function(){
    var a=document.createElement('a');
    a.href='../tucano.apk';
    a.download='tucano.apk';
    a.type='application/vnd.android.package-archive';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    document.getElementById('modal-download').classList.remove('show');
  });
  
  document.getElementById('modal-download').addEventListener('click',function(e){
    if(e.target===this) this.classList.remove('show');
  });

  if('serviceWorker' in navigator){ navigator.serviceWorker.register('../sw.js').catch(function(){}); }
});
})();
</script>
</body>
</html>
